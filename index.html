<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>帳簿 — Japan Work Ledger</title>
<meta name="description" content="Track income & expenses while working in Japan, auto-converted to your home currency.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17233d">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="帳簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#17233d; --ai-2:#223a5c; --washi:#ece3ce; --washi-2:#e2d6b7;
    --sumi:#2a251d; --hanko:#ac3527; --hanko-2:#c9432f; --kabocha:#d9822f; --mist:#7c8ba3; --line:#c8bd9c;
    --card:#fbf7ea; --shadow-sm:0 1px 2px rgba(42,37,29,.06), 0 1px 1px rgba(42,37,29,.04);
    --shadow-md:0 8px 20px -8px rgba(42,37,29,.18); --shadow-lg:0 20px 40px -16px rgba(23,35,61,.35);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--washi);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 28px);
    color:var(--sumi);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;padding-bottom:118px;position:relative;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .display{font-family:'Shippori Mincho',serif;}
  button{font-family:inherit;}
  button:active{transform:scale(.96);}
  button{transition:transform .15s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), opacity .18s var(--ease);}

  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}55%{transform:scale(.92) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(var(--rot));opacity:1;}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes sheetUp{0%{transform:translateY(100%);}100%{transform:translateY(0);}}
  @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

  .cover{
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(217,130,47,.22) 0%, transparent 55%),
      radial-gradient(90% 70% at 0% 100%, rgba(255,255,255,.06) 0%, transparent 60%),
      linear-gradient(150deg,#17233d 0%,#26365c 55%,#1b2a4a 100%);
    color:#eee6d2; padding:20px 20px 20px; border-radius:0 0 28px 28px;
    box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
  }
  .cover-content{position:relative;z-index:1;}
  .cover-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b9c2d6;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .install-banner{position:sticky;top:0;z-index:60;background:rgba(15,26,48,.92);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);color:#eee6d2;display:flex;align-items:center;gap:10px;
    padding:10px 14px;font-size:12.5px;box-shadow:0 2px 14px rgba(0,0,0,.3);animation:riseIn .35s var(--ease) both;}
  .install-banner img{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:block;}
  .install-banner .txt{flex:1;line-height:1.32;}
  .install-banner .install-go{background:var(--hanko);color:#fff5e8;border:none;border-radius:999px;
    padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer;flex:0 0 auto;white-space:nowrap;}
  .install-banner .install-close{background:none;border:none;color:#c7cede;cursor:pointer;padding:4px;
    font-size:16px;line-height:1;flex:0 0 auto;}
  .install-app-btn{width:100%;margin-top:10px;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:999px;
    border:1.5px dashed var(--line);background:transparent;color:var(--sumi);cursor:pointer;}
  .cover-top-row{display:flex;align-items:center;gap:11px;margin:10px 0 16px;}
  .avatar-btn-lg{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.1);color:#eadfc4;display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;cursor:pointer;overflow:hidden;padding:0;text-transform:none;letter-spacing:0;position:relative;}
  .avatar-btn-lg img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-btn-lg .dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;
    background:var(--hanko-2);border:1.5px solid #17233d;}
  .cover-greet{flex:1;min-width:0;}
  .cover-greet-hi{font-size:15.5px;font-weight:700;color:#f2ead6;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cover-greet-sub{font-size:11px;color:#9fabc4;margin-top:1px;}
  .cover-greeting{font-size:12px;color:#c7cede;margin:2px 0 0;}
  .profile-photo-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .profile-photo{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:#efe7d2;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
    font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;color:var(--mist);}
  .profile-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-actions{display:flex;flex-direction:column;gap:6px;}
  .photo-btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:var(--sumi);cursor:pointer;}
  .photo-btn.remove{color:var(--hanko);border-color:var(--hanko);background:transparent;}
  .balance-block{margin-bottom:14px;}
  .cover-balance-label-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
  .cover-balance-label{font-size:12px;color:#9fabc4;}
  .eye-toggle{flex:0 0 auto;background:none;border:none;color:#9fabc4;padding:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .eye-toggle svg{width:15px;height:15px;}
  .cover-balance{font-size:36px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:baseline;gap:6px;}
  .cover-balance .unit{font-size:16px;color:#c7cede;font-weight:500;}
  .cover-balance-idr{margin-top:4px;font-size:13px;color:#c3d4ab;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cover-balance-idr .kurs-inline{color:#9fabc4;}
  .kurs-chip{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;font-size:12px;color:#eadfc4;cursor:pointer;}
  .kurs-chip:active{transform:scale(.97);}
  .kurs-chip-static{cursor:default;}
  .kurs-chip-static:active{transform:none;}

  .summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0;}
  .sum-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
    box-shadow:var(--shadow-sm);animation:riseIn .4s var(--ease) both;}
  .sum-card .label{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .sum-card .val{font-size:18px;font-weight:600;}
  .sum-card.income .val{color:#8a6f18;}
  .sum-card.expense .val{color:var(--hanko);}

  /* visa/zairyu reminder chip di cover */
  .visa-chip{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;}
  .visa-chip.ok{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#eadfc4;}
  .visa-chip.warn{background:rgba(217,130,47,.22);border:1px solid rgba(217,130,47,.45);color:#ffd9a0;}
  .visa-chip.danger,.visa-chip.expired{background:rgba(172,53,39,.28);border:1px solid rgba(172,53,39,.55);color:#ffb3a8;}

  /* target nabung — reskin gaya banner promo */
  .goal-card{background:linear-gradient(150deg,var(--ai) 0%,var(--ai-2) 65%,#2c4568 100%);color:#eee6d2;
    border:none;border-radius:20px;padding:17px 18px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
  .goal-card::after{content:"目";position:absolute;right:8px;bottom:-14px;font-family:'Shippori Mincho',serif;
    font-size:88px;font-weight:800;color:rgba(255,255,255,.06);line-height:1;pointer-events:none;}
  .goal-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1;}
  .goal-card-name{font-weight:700;font-size:14.5px;}
  .goal-edit-link{font-size:12px;color:#c7cede;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;position:relative;z-index:1;}
  .goal-bar-track{width:100%;height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;position:relative;z-index:1;}
  .goal-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--kabocha),var(--hanko));transition:width .4s var(--ease);}
  .goal-progress-row{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#c7cede;position:relative;z-index:1;}
  .goal-empty-card{background:linear-gradient(150deg,var(--ai) 0%,var(--ai-2) 65%,#2c4568 100%);color:#eee6d2;
    border:none;border-radius:20px;padding:20px 18px;text-align:center;box-shadow:var(--shadow-md);}
  .goal-empty-card .goal-edit-link{text-decoration:none;font-weight:700;color:#fff5e8;font-size:12.5px;
    background:var(--hanko);padding:9px 18px;border-radius:999px;display:inline-block;}

  /* remitansi / kirim ke keluarga */
  .remit-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow-sm);}
  .remit-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .remit-summary-item .lbl{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .remit-summary-item .val{font-size:16px;font-weight:700;color:var(--hanko);}
  .remit-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px;}
  .remit-row .who{font-weight:600;}
  .remit-row .when{color:var(--mist);font-size:11px;}
  .remit-add-btn{width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1.5px dashed var(--hanko);
    background:rgba(172,53,39,.06);color:var(--hanko);font-weight:700;font-size:12.5px;cursor:pointer;}
  .remit-empty{text-align:center;color:var(--mist);font-size:12.5px;padding:8px 0 4px;}

  .section{padding:15px 16px 0;}
  .section-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px 12px;box-shadow:var(--shadow-sm);}
  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:132px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-col .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .chart-col .bar{width:9px;border-radius:4px 4px 0 0;min-height:2px;transition:height .5s var(--ease);}
  .chart-col .bar.masuk{background:linear-gradient(180deg,#e6994a,#d9822f);}
  .chart-col .bar.keluar{background:linear-gradient(180deg,#c1483a,#ac3527);}
  .chart-col .lbl{font-size:11px;color:var(--mist);margin-top:6px;}
  .chart-legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--mist);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .month-scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:16px -16px 0;}
  .month-scroller::-webkit-scrollbar{display:none;}
  .month-pill{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 13px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--sumi);cursor:pointer;transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);}
  .month-pill.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;box-shadow:var(--shadow-sm);}

  .ledger-filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px;}
  .filter-btn{padding:8px 6px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--sumi);
    font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);}
  .filter-btn.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;box-shadow:var(--shadow-sm);}
  .filter-btn.active.f-income{background:var(--kabocha);border-color:var(--kabocha);}
  .filter-btn.active.f-expense{background:var(--hanko);border-color:var(--hanko);}

  .ledger{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-title-row .section-title{margin-bottom:0;}
  .budget-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .budget-row{padding:12px 14px;border-bottom:1px dashed var(--line);}
  .budget-row:last-child{border-bottom:none;}
  .budget-row-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:7px;gap:8px;}
  .budget-row-head .cat{font-weight:700;color:var(--sumi);display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .budget-row-head .amt{color:var(--mist);font-size:11.5px;white-space:nowrap;}
  .budget-bar-track{width:100%;height:8px;border-radius:99px;background:var(--washi-2);overflow:hidden;}
  .budget-bar-fill{height:100%;border-radius:99px;transition:width .4s var(--ease);}
  .budget-bar-fill.ok{background:var(--ai);}
  .budget-bar-fill.warn{background:var(--kabocha);}
  .budget-bar-fill.over{background:var(--hanko);}
  /* ---- absensi harian & estimasi gaji ---- */
  .att-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .att-month-nav .lbl{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;}
  .att-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
    color:var(--sumi);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}
  .att-total-card{background:linear-gradient(150deg,var(--ai) 0%,var(--ai-2) 65%,#2c4568 100%);color:#eee6d2;
    border-radius:16px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .att-total-card .lbl{font-size:11.5px;color:#c7cede;}
  .att-total-card .val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;margin-top:2px;}
  .att-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:16px;}
  .att-row{padding:10px 14px;border-bottom:1px dashed var(--line);}
  .att-row:last-child{border-bottom:none;}
  .att-row-top{display:flex;align-items:center;justify-content:space-between;}
  .att-date{font-size:13px;font-weight:600;}
  .att-date small{color:var(--mist);font-weight:500;}
  .att-toggle{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:11.5px;
    font-weight:700;cursor:pointer;color:var(--mist);}
  .att-toggle.work{border-color:var(--ai);color:var(--ai);background:rgba(23,35,61,.06);}
  .att-row-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px;align-items:end;}
  .att-row-fields label{font-size:10px;color:var(--mist);display:block;}
  .att-row-fields input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:6px 7px;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;margin-top:3px;background:#fff;color:var(--sumi);}
  .att-hours-row{grid-column:1/-1;display:flex;justify-content:flex-end;font-size:11.5px;color:var(--hanko);
    font-weight:700;margin-top:2px;}
  .att-settings-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow-sm);}
  .payday-card{background:linear-gradient(150deg,var(--ai) 0%,var(--ai-2) 65%,#2c4568 100%);color:#eee6d2;
    border:none;border-radius:20px;padding:17px 18px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
  .payday-card::after{content:"給";position:absolute;right:8px;bottom:-14px;font-family:'Shippori Mincho',serif;
    font-size:88px;font-weight:800;color:rgba(255,255,255,.06);line-height:1;pointer-events:none;}
  .payday-stat-row{display:flex;gap:10px;position:relative;z-index:1;margin-top:2px;}
  .payday-stat{flex:1;}
  .payday-stat .num{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;line-height:1.2;}
  .payday-stat .lbl{font-size:11px;color:#c7cede;margin-top:3px;}
  .payday-card.danger .payday-stat .num{color:#ffb4a8;}
  .tool-card{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:14px 4px 12px;box-shadow:var(--shadow-sm);
    cursor:pointer;text-align:center;}
  .tool-card:active{transform:scale(.96);}
  .tool-card .ic-circle{width:42px;height:42px;border-radius:50%;background:var(--ai);color:var(--washi);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .tool-card .ic-circle svg{width:19px;height:19px;}
  .tool-card .tool-label{font-size:10.5px;font-weight:600;line-height:1.25;color:var(--sumi);}
  .more-tool-ic{width:32px;height:32px;border-radius:50%;background:var(--ai);color:var(--washi);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .more-tool-ic svg{width:16px;height:16px;}
  .payslip-hist-row{padding:12px 14px;border-bottom:1px dashed var(--line);}
  .payslip-hist-row:last-child{border-bottom:none;}
  .payslip-hist-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
  .payslip-hist-head .month{font-weight:700;font-size:13px;color:var(--sumi);}
  .payslip-hist-head .amt{font-size:13px;font-weight:700;color:var(--ai);}
  .payslip-hist-detail{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none;}
  .payslip-hist-detail.open{display:block;}
  .payslip-hist-detail .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mist);padding:3px 0;}
  .receipt-hist-row{padding:12px 14px;border-bottom:1px dashed var(--line);}
  .receipt-hist-row:last-child{border-bottom:none;}
  .receipt-hist-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .receipt-hist-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#efe7d2;border:1px solid var(--line);}
  .receipt-hist-thumb.empty{display:flex;align-items:center;justify-content:center;font-size:17px;}
  .receipt-hist-main{flex:1;min-width:0;}
  .receipt-hist-main .date{font-weight:700;font-size:13px;color:var(--sumi);display:block;}
  .receipt-hist-main .sub{font-size:11.5px;color:var(--mist);}
  .receipt-hist-head .amt{font-size:13px;font-weight:700;color:var(--hanko);white-space:nowrap;}
  .receipt-hist-detail{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none;}

function buildBackupObject() {
  return {
    app: "japan-work-ledger", version: 1, exportedAt: new Date().toISOString(),
    transactions, rates, currency, profile, savingsGoals, otCalc, lang, payslips,
    balanceHidden, visaChecklist, savedRecipients, emergencyContacts, budgets, dependents,
    attendance, wageSettings, receiptHistory,
  };
}
function downloadBackup() {
  const data = JSON.stringify(buildBackupObject(), null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `japan-work-ledger-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function applyBackupObject(obj) {
  if (!obj || typeof obj !== "object") return false;
  if (Array.isArray(obj.transactions)) { transactions = obj.transactions; saveTx(); }
  if (obj.rates && typeof obj.rates === "object") { rates = obj.rates; saveRates(); }
  if (obj.currency) { currency = obj.currency; saveCurrency(); }
  if (obj.profile) { profile = Object.assign({ name: "", note: "", photo: "", visaExpiry: "", paydayDay: "" }, obj.profile); saveProfile(); }
  if (Array.isArray(obj.savingsGoals)) { savingsGoals = obj.savingsGoals; saveGoals(); }
  if (obj.otCalc) { otCalc = obj.otCalc; saveOtCalc(); }
  if (obj.lang && LANGUAGES.some(x => x.code === obj.lang)) { lang = obj.lang; saveLang(); }
  if (Array.isArray(obj.payslips)) { payslips = obj.payslips; savePayslips(); }
  if (typeof obj.balanceHidden === "boolean") { balanceHidden = obj.balanceHidden; saveBalanceHidden(); }
  if (Array.isArray(obj.visaChecklist)) { visaChecklist = obj.visaChecklist; saveVisaChecklist(); }
  if (Array.isArray(obj.savedRecipients)) { savedRecipients = obj.savedRecipients; saveRecipients(); }
  if (Array.isArray(obj.emergencyContacts)) { emergencyContacts = obj.emergencyContacts; saveEmergencyContacts(); }
  if (obj.budgets && typeof obj.budgets === "object") { budgets = obj.budgets; saveBudgets(); }
  if (Array.isArray(obj.dependents)) { dependents = obj.dependents; saveDependents(); }
  if (obj.attendance && typeof obj.attendance === "object") { attendance = obj.attendance; saveAttendance(); }
  if (obj.wageSettings && typeof obj.wageSettings === "object") { wageSettings = Object.assign({ hourlyWage: "", rent: "", utilities: "" }, obj.wageSettings); saveWageSettings(); }
  if (Array.isArray(obj.receiptHistory)) { receiptHistory = obj.receiptHistory; saveReceiptHistory(); }
  return true;
}

// resize+compress foto profil ke max 240x240 biar hemat localStorage
function readAndResizeImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- derived ----
function totalYen() { return transactions.reduce((s,t)=> s + (t.type==="income"? t.amount : -t.amount), 0); }
// ---- budget per kategori: total pengeluaran bulan ini per kategori ----
function expenseThisMonthByCat() {
  const mk = monthKey(new Date());
  const map = {};
  transactions.filter(t => t.type === "expense" && monthKey(parseLocalDate(t.date)) === mk).forEach(t => {
    map[t.catId] = (map[t.catId] || 0) + t.amount;
  });
  return map;
}
// ---- budget sampai gajian: hitung sisa hari & jatah harian aman ----
function paydayRunway() {
  const day = parseInt(profile.paydayDay, 10);
  if (!day || day < 1 || day > 31) return null;
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const clampDay = (y, m) => Math.min(day, new Date(y, m + 1, 0).getDate());
  let py = now.getFullYear(), pm = now.getMonth();
  let next = new Date(py, pm, clampDay(py, pm));
  if (next <= todayMid) {
    pm += 1; if (pm > 11) { pm = 0; py += 1; }
    next = new Date(py, pm, clampDay(py, pm));
  }
  const daysLeft = Math.max(1, Math.round((next - todayMid) / 86400000));
  const balance = totalYen();
  const dailySafe = balance / daysLeft;
  return { daysLeft, balance, dailySafe, paydayDate: next };
}
function monthsPresent() {
  const set = new Set(transactions.map(t => monthKey(parseLocalDate(t.date))));
  set.add(monthKey(new Date()));
  return Array.from(set).sort().reverse();
}
function monthTx() { return transactions.filter(t => monthKey(parseLocalDate(t.date)) === selectedMonth); }
// ---- remitansi (kirim ke keluarga) ----
function remittanceTx() { return transactions.filter(t => t.catId === "kirim" && t.type === "expense"); }
function remittanceThisMonth() { const mk = monthKey(new Date()); return remittanceTx().filter(t => monthKey(parseLocalDate(t.date)) === mk); }
function remittanceThisYear() { const y = new Date().getFullYear(); return remittanceTx().filter(t => parseLocalDate(t.date).getFullYear() === y); }
function remittanceHomeValue(tx) { return Math.round(tx.amount * (tx.rateUsed || getRate())); }

function remittanceByRecipient() {
  const mk = monthKey(new Date());
  const y = new Date().getFullYear();
  const map = new Map();
  remittanceTx().forEach(tx => {
    const name = (tx.recipient || "").trim() || t("recipientUnlabeled");
    if (!map.has(name)) map.set(name, { name, monthTotal: 0, yearTotal: 0, allTotal: 0, lastDate: tx.date, count: 0 });
    const r = map.get(name);
    r.allTotal += tx.amount;
    r.count += 1;
    if (monthKey(parseLocalDate(tx.date)) === mk) r.monthTotal += tx.amount;
    if (parseLocalDate(tx.date).getFullYear() === y) r.yearTotal += tx.amount;
    if (tx.date > r.lastDate) r.lastDate = tx.date;
  });
  return Array.from(map.values()).sort((a,b) => b.allTotal - a.allTotal);
}

function depCategoryInfo(catId) { return DEPENDENT_CATEGORIES.find(c => c.id === catId) || DEPENDENT_CATEGORIES[0]; }
function dependentStatus(dep) {
  const cat = depCategoryInfo(dep.category);

  return { cat, yearTotal, eligible, deduction: eligible ? cat.deduction : 0, shortfall: Math.max(0, cat.minRemit - yearTotal) };
}

// ---- target nabung ----
function goalProgressPct(targetAmount) {
  const target = parseFloat(targetAmount) || 0;
  if (target <= 0) return 0;
  const currentHome = totalYen() * getRate();
  return Math.max(0, Math.min(100, (currentHome / target) * 100));
}
// ---- visa/zairyu reminder ----
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}
function visaUrgency(days) {
  if (days === null) return null;
  if (days < 0) return "expired";
  if (days <= 30) return "danger";
  if (days <= 90) return "warn";
  return "ok";
}
// ---- kalkulator lembur (zangyou) — aturan dasar Jepang: lembur biasa 125%, lembur malam (22:00-05:00) 150%,
// kerja hari libur wajib 135%, kerja hari libur + malam 160%. Ini estimasi kasar, bukan angka resmi HR.
function computeOvertime() {
  const wage = parseFloat(otCalc.wage) || 0;
  const h = k => parseFloat(otCalc[k]) || 0;
  const rows = [
    { key: "normalOtH", mult: 1.25 },
    { key: "nightOtH", mult: 1.5 },
    { key: "holidayH", mult: 1.35 },
    { key: "holidayNightH", mult: 1.6 },
  ].map(r => ({ ...r, hours: h(r.key), pay: wage * h(r.key) * r.mult }));
  const total = rows.reduce((s,r)=>s+r.pay,0);
  return { rows, total, wage };
}
// ---- absensi harian & estimasi gaji ----
function daysInMonthOf(mk) {
  const [y, m] = mk.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function timeToMin(str) {
  if (!str || str.indexOf(":") === -1) return null;
  const [h, m] = str.split(":").map(Number);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function dailyMinutes(rec) {
  if (!rec || !rec.work) return 0;
  const s = timeToMin(rec.start), e = timeToMin(rec.end);
  if (s === null || e === null) return 0;
  const brk = parseFloat(rec.brk) || 0;
  const raw = e - s - brk;
  return raw > 0 ? raw : 0;
}
function fmtHM(min) {
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h + "h " + String(m).padStart(2, "0") + "m";
}
function computeAttendanceMonth(mk) {
  let totalMin = 0, workDays = 0;
  const days = daysInMonthOf(mk);
  for (let d = 1; d <= days; d++) {
    const key = mk + "-" + String(d).padStart(2, "0");
    const rec = attendance[key];
    if (rec && rec.work) { totalMin += dailyMinutes(rec); workDays++; }
  }
  return { totalMin, workDays };
}
// ---- estimasi potongan wajib Jepang (厚生年金・健康保険・雇用保険・所得税) dari gaji kotor bulanan ----
// Tarif 社会保険 di sini pakai tarif resmi standar (bagian karyawan / employee share):
// - 厚生年金 (kousei nenkin): 18.3% total, dibagi 50/50 → 9.15% karyawan (tetap sejak 2017)
// - 健康保険 (kenko hoken): rata-rata nasional 協会けんぽ ~9.98% total, dibagi 50/50 → ~4.99% karyawan
//   (tarif aslinya beda tipis per-prefektur, ini rata-rata nasional)
// - 雇用保険 (koyo hoken): 0.5% karyawan — tarif 令和8年度 (FY Apr 2026-Mar 2027), turun dari 0.55% (FY2025)
// 所得税 (shotokuzei) didekati dari penyetahunan gaji bulanan pakai bracket + basic deduction (基礎控除)
// hasil reformasi pajak 2025-2026 (naik dari flat 480rb jadi berjenjang s.d. 950rb), lalu dibagi 12 —
// BUKAN tabel 源泉徴収 resmi persis.
function kisoKoujoForIncome(annualGross) {
  // 合計所得金額 berjenjang (令和7-8年度 / 2025-2026 tax reform), pendekatan pakai gross sbg proxy income
  if (annualGross <= 1320000) return 950000;
  if (annualGross <= 3360000) return 880000;
  if (annualGross <= 4890000) return 680000;
  if (annualGross <= 6550000) return 630000;
  if (annualGross <= 23500000) return 580000;
  return 480000;
}
function estimateJapanDeductions(gross) {
  if (!gross || gross <= 0) return { kouseiNenkin: 0, kenkoHoken: 0, koyoHoken: 0, shotokuzei: 0 };
  const kouseiNenkin = gross * 0.0915;
  const kenkoHoken = gross * 0.0499;
  const koyoHoken = gross * 0.005;
  const shakaiHokenMonthly = kouseiNenkin + kenkoHoken + koyoHoken;
  const annualGross = gross * 12;
  const kyuyoKoujo = annualGross <= 1625000 ? 650000 : Math.max(650000, Math.round(annualGross * 0.3 + 80000));
  const kisoKoujo = kisoKoujoForIncome(annualGross);
  const kazeiShotoku = Math.max(0, annualGross - kyuyoKoujo - kisoKoujo - shakaiHokenMonthly * 12);
  let annualTax = kazeiShotoku <= 1950000 ? kazeiShotoku * 0.05 : kazeiShotoku * 0.10 - 97500;
  annualTax = Math.max(0, annualTax) * 1.021; // + 復興特別所得税 2.1%
  const shotokuzei = annualTax / 12;
  return { kouseiNenkin, kenkoHoken, koyoHoken, shotokuzei };
}
function computeAbsensiPay() {
  const wage = parseFloat(wageSettings.hourlyWage) || 0;
  const { totalMin } = computeAttendanceMonth(attendanceMonth);
  const totalHours = totalMin / 60;
  const gross = totalHours * wage;
  const rent = parseFloat(wageSettings.rent) || 0;
  const utilities = parseFloat(wageSettings.utilities) || 0;
  const jp = estimateJapanDeductions(gross);
  const totalDeduct = rent + utilities + jp.kouseiNenkin + jp.kenkoHoken + jp.koyoHoken + jp.shotokuzei;
  const net = gross - totalDeduct;
  return { totalMin, totalHours, gross, rent, utilities, jp, totalDeduct, net };
}
// ---- cek halal: cocokkan teks hasil OCR ke kamus kata kunci ----
function analyzeHalalText(text) {
  // NFKC dulu (fullwidth->halfwidth), terus buang whitespace + karakter noise OCR yg suka
  // nyempil di antara kanji/katakana (titik tengah, pipe, tanda seru palsu) — biar keyword
  // yg aslinya nempel ("豚肉") tapi kebaca ada sisipan noise ("豚 肉" / "豚|肉") tetep ke-match.
  const norm = normalizeOcrText(text).replace(/[\s・･|!！]+/g, "");
  const findMatches = (list) => list.filter(k => norm.includes(k.jp.replace(/\s+/g, "")));
  let haramMatches = findMatches(HALAL_KEYWORDS.haram);
  // dedup: kalau kata kunci babi yg lebih spesifik ("豚肉","豚脂",dst) udah ketemu,
  // gak perlu nampilin generic "豚"/"pork" lagi krn itu cuma substring yg sama.
  const genericPork = new Set(["豚", "pork"]);
  const hasSpecificPork = haramMatches.some(m => !genericPork.has(m.jp));
  if (hasSpecificPork) haramMatches = haramMatches.filter(m => !genericPork.has(m.jp));
  const syubhatMatches = findMatches(HALAL_KEYWORDS.syubhat);
  // dedup serupa: "本みりん" udah ngandung "みりん" sbg substring, jgn dobel ditampilin.
  const dedupedSyubhat = syubhatMatches.some(m => m.jp === "本みりん")
    ? syubhatMatches.filter(m => m.jp !== "みりん")
    : syubhatMatches;
  let verdict = "green";
  if (haramMatches.length > 0) verdict = "red";
  else if (dedupedSyubhat.length > 0) verdict = "yellow";
  return { verdict, haramMatches, syubhatMatches: dedupedSyubhat, rawText: text || "", scannedAt: Date.now() };
}
function chartData() {
  const now = new Date(); const out = [];
  for (let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = monthKey(d);
    const inc = transactions.filter(t=>t.type==="income" && monthKey(parseLocalDate(t.date))===key).reduce((s,t)=>s+t.amount,0);
    const exp = transactions.filter(t=>t.type==="expense" && monthKey(parseLocalDate(t.date))===key).reduce((s,t)=>s+t.amount,0);
    out.push({ name: monthLabel(d.getMonth()), masuk: inc, keluar: exp });
  }
  return out;
}

function attachEvents() {
  const app = document.getElementById("app");

  const installGoBtn = document.getElementById("installGoBtn");
  if (installGoBtn) {
    installGoBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      try {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
      } catch (e) {}
      deferredInstallPrompt = null;
      showInstallBanner = false;
      render();
    });
  }
  const installCloseBtn = document.getElementById("installCloseBtn");
  if (installCloseBtn) {
    installCloseBtn.addEventListener("click", () => {
      showInstallBanner = false;
      setInstallDismissed();
      render();
    });
  }
  const installAppSettingsBtn = document.getElementById("installAppSettingsBtn");
  if (installAppSettingsBtn) {
    installAppSettingsBtn.addEventListener("click", async () => {
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
        } catch (e) {}
        deferredInstallPrompt = null;
        showInstallBanner = false;
        render();
      } else if (isIOS()) {
        showInstallBanner = true;
        installBannerKind = "ios";
        showSettings = false;
        render();
      }
    });
  }

  app.querySelectorAll(".month-pill").forEach(el => {
    el.addEventListener("click", () => { selectedMonth = el.dataset.month; ledgerPage = 0; render(); });
  });

  app.querySelectorAll("[data-filter]").forEach(el => {
    el.addEventListener("click", () => { ledgerFilter = el.dataset.filter; ledgerPage = 0; render(); });
  });

  const ledgerPrevBtn = document.getElementById("ledgerPrevBtn");
  if (ledgerPrevBtn) ledgerPrevBtn.addEventListener("click", () => { ledgerPage = Math.max(0, ledgerPage - 1); render(); });
  const ledgerNextBtn = document.getElementById("ledgerNextBtn");
  if (ledgerNextBtn) ledgerNextBtn.addEventListener("click", () => { ledgerPage = ledgerPage + 1; render(); });

  app.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", () => {
      transactions = transactions.filter(t => t.id !== el.dataset.del);
      saveTx(); render();
    });
  });

  // buka sheet Pengaturan (dari navProfileBtn di bottom nav)
  const openSettings = () => {
    settingsForm = {
      name: profile.name, note: profile.note, photo: profile.photo,
      lang: lang, currency: currency, rate: String(getRate()),
      visaExpiry: profile.visaExpiry || "",
    };
    showSettings = true;
    render();
  };

  const closeSettingsSheet = document.getElementById("closeSettingsSheet");
  const settingsBackdrop = document.getElementById("settingsBackdrop");
  if (closeSettingsSheet) closeSettingsSheet.addEventListener("click", () => { showSettings = false; render(); });
  if (settingsBackdrop) settingsBackdrop.addEventListener("click", (e) => { if (e.target === settingsBackdrop) { showSettings = false; render(); } });
  const settingsSheetInner = document.getElementById("settingsSheetInner");
  if (settingsSheetInner) settingsSheetInner.addEventListener("click", e => e.stopPropagation());

  const photoInput = document.getElementById("photoInput");
  if (photoInput) {
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      try {
        settingsForm.photo = await readAndResizeImage(file, 240);
        render();
      } catch (e) {
        alert("Gagal memuat foto, coba foto lain ya. / Failed to load photo, try another one.");
      }
    });
  }
  const removePhotoBtn = document.getElementById("removePhotoBtn");
  if (removePhotoBtn) removePhotoBtn.addEventListener("click", () => { settingsForm.photo = ""; render(); });

  const settingsNameInput = document.getElementById("settingsNameInput");
  if (settingsNameInput) settingsNameInput.addEventListener("input", () => { settingsForm.name = settingsNameInput.value; });
  const settingsNoteInput = document.getElementById("settingsNoteInput");
  if (settingsNoteInput) settingsNoteInput.addEventListener("input", () => { settingsForm.note = settingsNoteInput.value; });
  const settingsRateInput = document.getElementById("settingsRateInput");
  if (settingsRateInput) settingsRateInput.addEventListener("input", () => { settingsForm.rate = settingsRateInput.value; });
  const settingsVisaInput = document.getElementById("settingsVisaInput");
  if (settingsVisaInput) settingsVisaInput.addEventListener("change", () => { settingsForm.visaExpiry = settingsVisaInput.value; });

  // pilih bahasa: klik chip langsung ubah draft & render ulang (sheet tetap terbuka)
  app.querySelectorAll("[data-lang]").forEach(el => {
    el.addEventListener("click", () => { settingsForm.lang = el.dataset.lang; render(); });
  });

  // pilih mata uang: klik chip, kurs terisi otomatis dari nilai tersimpan/default utk mata uang itu
  app.querySelectorAll("[data-currency]").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.dataset.currency;
      settingsForm.currency = code;
      const cur = CURRENCIES.find(c => c.code === code) || CURRENCIES[0];
      settingsForm.rate = String(rates[code] !== undefined ? rates[code] : cur.rate);
      render();
    });
  });

  const settingsFormEl = document.getElementById("settingsForm");
  if (settingsFormEl) {
    settingsFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      profile = { name: (settingsForm.name||"").trim(), note: (settingsForm.note||"").trim(), photo: settingsForm.photo || "", visaExpiry: settingsForm.visaExpiry || "" };
      saveProfile();
      lang = settingsForm.lang || "id";
      saveLang();
      currency = settingsForm.currency || "IDR";
      const v = parseFloat(String(settingsForm.rate).replace(",", "."));
      if (v > 0) rates[currency] = v;
      saveRates();
      saveCurrency();
      showSettings = false;
      render();
    });
  }

  const fab = document.getElementById("fabBtn");
  if (fab) fab.addEventListener("click", () => { showForm = true; render(); });

  // ---- kirim ke keluarga: shortcut buka form transaksi pre-filled expense/kirim ----
  const openRemitBtn = document.getElementById("openRemitBtn");
  if (openRemitBtn) openRemitBtn.addEventListener("click", () => {
    form = { type: "expense", catId: "kirim", amount: "", date: new Date().toISOString().slice(0,10), note: "", split: false, splitCount: 2, splitMode: "mine", recipient: "", feeYen: "", rateUsed: String(getRate()), tagDependent: false, dependentCategory: "young" };
    showForm = true;
    render();
  });

  // ---- target nabung (multi-goal: bisa nambah beberapa pos keperluan) ----
  const addGoalBtn = document.getElementById("addGoalBtn");
  if (addGoalBtn) addGoalBtn.addEventListener("click", () => {
    goalDraft = { id: null, label: "", targetAmount: "" };
    showGoalSheet = true;
    render();
  });
  document.querySelectorAll(".goal-edit-open").forEach(btn => {
    btn.addEventListener("click", () => {
      const gid = btn.dataset.goalId;
      const g = savingsGoals.find(x => x.id === gid);
      goalDraft = g ? { id: g.id, label: g.label || "", targetAmount: g.targetAmount || "" } : { id: null, label: "", targetAmount: "" };
      showGoalSheet = true;
      render();
    });
  });
  const closeGoalSheet = document.getElementById("closeGoalSheet");
  const goalBackdrop = document.getElementById("goalBackdrop");
  if (closeGoalSheet) closeGoalSheet.addEventListener("click", () => { showGoalSheet = false; render(); });
  if (goalBackdrop) goalBackdrop.addEventListener("click", (e) => { if (e.target === goalBackdrop) { showGoalSheet = false; render(); } });
  const goalLabelInput = document.getElementById("goalLabelInput");
  if (goalLabelInput) goalLabelInput.addEventListener("input", () => { goalDraft.label = goalLabelInput.value; });
  const goalAmountInput = document.getElementById("goalAmountInput");
  if (goalAmountInput) goalAmountInput.addEventListener("input", () => { goalDraft.targetAmount = goalAmountInput.value.replace(/[^0-9]/g, ""); goalAmountInput.value = goalDraft.targetAmount; });
  const goalFormEl = document.getElementById("goalForm");
  if (goalFormEl) goalFormEl.addEventListener("submit", (e) => {
    e.preventDefault();
    const label = (goalDraft.label||"").trim();
    const targetAmount = goalDraft.targetAmount || "";
    if (goalDraft.id) {
      const idx = savingsGoals.findIndex(x => x.id === goalDraft.id);
      if (idx !== -1) savingsGoals[idx] = { id: goalDraft.id, label, targetAmount };
    } else {
      savingsGoals.push({ id: uid(), label, targetAmount });
    }
    saveGoals();
    showGoalSheet = false;
    render();
  });
  const removeGoalBtn = document.getElementById("removeGoalBtn");
  if (removeGoalBtn) removeGoalBtn.addEventListener("click", () => {
    savingsGoals = savingsGoals.filter(x => x.id !== goalDraft.id);
    saveGoals();
    showGoalSheet = false;
    render();
  });

  // ---- absensi harian & estimasi gaji ----
  const closeAttendance = document.getElementById("closeAttendance");
  const attendanceBackdrop = document.getElementById("attendanceBackdrop");
  if (closeAttendance) closeAttendance.addEventListener("click", () => { showAttendanceScreen = false; render(); });
  if (attendanceBackdrop) attendanceBackdrop.addEventListener("click", (e) => { if (e.target === attendanceBackdrop) { showAttendanceScreen = false; render(); } });
  const attPrevMonth = document.getElementById("attPrevMonth");
  const attNextMonth = document.getElementById("attNextMonth");
  const shiftAttMonth = (delta) => {
    const [y, m] = attendanceMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    attendanceMonth = monthKey(d);
    render();
  };
  if (attPrevMonth) attPrevMonth.addEventListener("click", () => shiftAttMonth(-1));
  if (attNextMonth) attNextMonth.addEventListener("click", () => shiftAttMonth(1));
  const attendanceList = document.getElementById("attendanceList");
  const refreshAttSummary = () => {
    const totalEl = document.getElementById("attMonthTotalVal");
    if (totalEl) totalEl.textContent = fmtHM(computeAttendanceMonth(attendanceMonth).totalMin);
    const pay = computeAbsensiPay();
    const grossEl = document.getElementById("absensiGrossVal");
    if (grossEl) grossEl.textContent = "¥" + yenFmt.format(Math.round(pay.gross));
    const kouseiEl = document.getElementById("absensiKouseiVal");
    if (kouseiEl) kouseiEl.textContent = "-¥" + yenFmt.format(Math.round(pay.jp.kouseiNenkin));
    const kenkoEl = document.getElementById("absensiKenkoVal");
    if (kenkoEl) kenkoEl.textContent = "-¥" + yenFmt.format(Math.round(pay.jp.kenkoHoken));

      const mk = payslipMonthInput ? payslipMonthInput.value : payslipDraft.monthKey;

    const MIN_SIZE = 40; // px layar, batas minimum ukuran box biar gak collapse

    const getRotBounds = () => ({
      w: (cropRotation === 90 || cropRotation === 270) ? cropNaturalH : cropNaturalW,
      h: (cropRotation === 90 || cropRotation === 270) ? cropNaturalW : cropNaturalH,
    });

    const startDrag = (mode, ev) => {
      ev.preventDefault();
      cropDragMode = mode;
      const p = ev.touches ? ev.touches[0] : ev;
      cropDragStart = { px: p.clientX, py: p.clientY, rect: { ...cropRect } };
      const onMove = (mv) => {
        const mp = mv.touches ? mv.touches[0] : mv;
        const dxDisp = mp.clientX - cropDragStart.px, dyDisp = mp.clientY - cropDragStart.py;
        const dx = dxDisp / cropDisplayScale, dy = dyDisp / cropDisplayScale;
        const bounds = getRotBounds();
        let r = { ...cropDragStart.rect };
        if (cropDragMode === "move") {
          r.x = Math.min(Math.max(0, r.x + dx), bounds.w - r.w);
          r.y = Math.min(Math.max(0, r.y + dy), bounds.h - r.h);
        } else {
          const minSizeNat = MIN_SIZE / cropDisplayScale;
          if (cropDragMode === "tl") {
            const nx = Math.min(r.x + dx, r.x + r.w - minSizeNat);
            const ny = Math.min(r.y + dy, r.y + r.h - minSizeNat);
            r.w = r.x + r.w - Math.max(0, nx); r.h = r.y + r.h - Math.max(0, ny);
            r.x = Math.max(0, nx); r.y = Math.max(0, ny);
          } else if (cropDragMode === "tr") {
            const ny = Math.min(r.y + dy, r.y + r.h - minSizeNat);
            r.w = Math.min(bounds.w - r.x, Math.max(minSizeNat, r.w + dx));
            r.h = r.y + r.h - Math.max(0, ny);
            r.y = Math.max(0, ny);
          } else if (cropDragMode === "bl") {
            const nx = Math.min(r.x + dx, r.x + r.w - minSizeNat);
            r.w = r.x + r.w - Math.max(0, nx);
            r.x = Math.max(0, nx);
            r.h = Math.min(bounds.h - r.y, Math.max(minSizeNat, r.h + dy));
          } else if (cropDragMode === "br") {
            r.w = Math.min(bounds.w - r.x, Math.max(minSizeNat, r.w + dx));
            r.h = Math.min(bounds.h - r.y, Math.max(minSizeNat, r.h + dy));
          }
        }
        cropRect = r;
        // update posisi box langsung tanpa render() penuh, biar drag mulus
        const offX = parseFloat(cropBox.dataset.offX || "0"), offY = parseFloat(cropBox.dataset.offY || "0");
        cropBox.style.left = (offX + r.x * cropDisplayScale) + "px";
        cropBox.style.top = (offY + r.y * cropDisplayScale) + "px";
        cropBox.style.width = (r.w * cropDisplayScale) + "px";
        cropBox.style.height = (r.h * cropDisplayScale) + "px";
      };
      const onUp = () => {
        cropDragMode = null;
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        document.removeEventListener("touchmove", onMove);
        document.removeEventListener("touchend", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
      document.addEventListener("touchmove", onMove, { passive: false });
      document.addEventListener("touchend", onUp);
    };

    if (cropBox) {
      cropBox.addEventListener("mousedown", (e) => { if (e.target === cropBox) startDrag("move", e); });

      cropBox.querySelectorAll("[data-handle]").forEach((h) => {

        h.addEventListener("touchstart", (e) => startDrag(h.dataset.handle, e), { passive: false });
      });
    }

// ---- OCR scan struk (Tesseract.js, dimuat on-demand, jalan di browser, gak ada foto yg disimpan) ----
function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error("Gagal memuat pustaka OCR"));
    document.head.appendChild(s);
  });
}
// ---- baca PDF (slip gaji yg dikirim dalam bentuk file PDF), dimuat on-demand ----
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error("Gagal memuat pustaka PDF"));
    document.head.appendChild(s);
  });
}
// render halaman pertama PDF jadi <img> biasa, biar bisa lewat crop tool & alur OCR yg sama kayak foto
async function loadImageFromPdfFile(file) {
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 2.5 }); // resolusi cukup buat OCR
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  const dataUrl = canvas.toDataURL("image/png");
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}
function guessTaxRate(label) {
  // fallback kalau struk gak pakai penanda "*" sama sekali (jarang) — nebak dari nama barang
  const higherRate = /(beer|wine|sake|alcohol|whisky|whiskey|shochu|chuhai|highball|liquor|cigarette|tobacco|tissue|towel|battery|magazine|newspaper|umbrella|soap|shampoo|detergent|mask|cable|charger|ビール|酒|ワイン|チューハイ|ハイボール|タバコ|タオル|電池|雑誌|洗剤|マスク)/i;
  return higherRate.test(label) ? 10 : 8;
}

// ---- estimasi nenkin (脱退一時金) & refund pajak penghasilan, dihitung dari payslips yg tersimpan ----
function computeEstimates() {
  const withKousei = payslips.filter(p => p.fields && p.fields.kouseiNenkin > 0);
  const monthsRaw = withKousei.length;
  const avgStandard = monthsRaw > 0
    ? withKousei.reduce((s, p) => s + (p.fields.kouseiNenkin / 0.0915), 0) / monthsRaw
    : 0;
  // 支給率計算に用いる数: kelipatan 6 bulan, maks 60 (batas resmi berlaku skrg; rencana naik ke 96 blm pasti)
  const N = monthsRaw >= 6 ? Math.min(60, Math.floor(monthsRaw / 6) * 6) : 0;
  const nenkinGross = avgStandard * 0.0915 * N;
  const nenkinNet = nenkinGross * (1 - 0.2042);

  // estimasi pajak: total penghasilan kotor & 所得税 yg udah kepotong dari semua payslip tersimpan,
  // dianggap sbg gambaran satu tahun (kalau datanya emang buat 1 tahun kalender penuh, hasilnya representatif)
  const totalGross = payslips.reduce((s, p) => s + (p.fields.gross || 0), 0);
  const totalShakaiHoken = payslips.reduce((s, p) => s + (p.fields.kenkoHoken || 0) + (p.fields.kouseiNenkin || 0) + (p.fields.koyoHoken || 0), 0);
  const totalWithheld = payslips.reduce((s, p) => s + (p.fields.shotokuzei || 0), 0);

  const kyuyoKoujo = totalGross <= 1625000 ? 650000 : Math.max(650000, Math.round(totalGross * 0.3 + 80000));
  const kisoKoujo = totalGross - kyuyoKoujo <= 1320000 ? 950000 : 480000; // penyederhanaan, lihat disclaimer
  const fuyoKoujo = totalDependentDeduction();
  const kazeiShotoku = Math.max(0, totalGross - kyuyoKoujo - kisoKoujo - totalShakaiHoken - fuyoKoujo);
  let liability = kazeiShotoku <= 1950000 ? kazeiShotoku * 0.05 : kazeiShotoku * 0.10 - 97500;
  liability = Math.max(0, liability) * 1.021; // + 復興特別所得税 2.1%
  const refund = totalWithheld - liability;

  return {
    nenkin: { months: monthsRaw, avgStandard, gross: nenkinGross, net: nenkinNet },
    tax: { withheld: totalWithheld, liability, refund, fuyoKoujo },
  };
}
function computeItemTotal() {
  const checked = (scanItems||[]).filter(i => i.checked);
  if (scanIncludeTax) return checked.reduce((s, i) => s + i.price, 0);
  // pajak konsumsi Jepang dihitung dari SUBTOTAL GABUNGAN per kelompok tarif (baru di-floor),
  // bukan floor per-barang lalu dijumlah — dua cara ini bisa beda hasil krn floor gak linear.
  const sum8 = checked.filter(i => i.taxRate !== 10).reduce((s, i) => s + i.price, 0);
  const sum10 = checked.filter(i => i.taxRate === 10).reduce((s, i) => s + i.price, 0);
  return sum8 + sum10 + Math.floor(sum8 * 0.08) + Math.floor(sum10 * 0.10);
}
// deteksi gaya "外税" (pajak dipisah dari harga barang) dari POLA ANGKA di struk, per kelompok tarif (8%/10%)
// — gak bergantung OCR bisa baca kanji dgn benar, murni matematis.
function detectAddedTax(text, items) {
  const sum8 = items.filter(i => i.taxRate === 8).reduce((s,i) => s+i.price, 0);
  const sum10 = items.filter(i => i.taxRate === 10).reduce((s,i) => s+i.price, 0);
  const lines = normalizeOcrText(text).split(/\n/);
  let matched = false;
  lines.forEach(line => {
    const pct = line.match(/(8|10)\s*%/);
    if (!pct) return;
    const nums = line.match(/[0-9][0-9,]{1,7}/g);
    if (!nums) return;

  canvas.width = Math.round(dispW * dpr); canvas.height = Math.round(dispH * dpr);
  canvas.style.width = dispW + "px"; canvas.style.height = dispH + "px";

  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.translate(dispW / 2, dispH / 2);
  ctx.rotate(cropRotation * Math.PI / 180);
  if (cropRotation === 90 || cropRotation === 270) {
    ctx.drawImage(cropImgEl, -dispH / 2, -dispW / 2, dispH, dispW);
  } else {
    ctx.drawImage(cropImgEl, -dispW / 2, -dispH / 2, dispW, dispH);
  }
  ctx.restore();

  cropDisplayScale = dispW / rotW;

  // posisiin crop-box (canvas ada di tengah stage via flexbox, jadi tambahin offset canvas relatif ke stage)
  const canvasRect = canvas.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const offX = canvasRect.left - stageRect.left, offY = canvasRect.top - stageRect.top;
  box.style.left = (offX + cropRect.x * cropDisplayScale) + "px";
  box.style.top = (offY + cropRect.y * cropDisplayScale) + "px";
  box.style.width = (cropRect.w * cropDisplayScale) + "px";
  box.style.height = (cropRect.h * cropDisplayScale) + "px";
  box.dataset.offX = offX; box.dataset.offY = offY;
}
function performCropAndProceed() {
  const rotW = (cropRotation === 90 || cropRotation === 270) ? cropNaturalH : cropNaturalW;
  const rotH = (cropRotation === 90 || cropRotation === 270) ? cropNaturalW : cropNaturalH;
  const rotCanvas = document.createElement("canvas");
  rotCanvas.width = rotW; rotCanvas.height = rotH;
  const rctx = rotCanvas.getContext("2d");
  rctx.imageSmoothingEnabled = true; rctx.imageSmoothingQuality = "high";
  rctx.save();
  rctx.translate(rotW / 2, rotH / 2);
  rctx.rotate(cropRotation * Math.PI / 180);
  if (cropRotation === 90 || cropRotation === 270) {
    rctx.drawImage(cropImgEl, -rotH / 2, -rotW / 2, rotH, rotW);
  } else {
    rctx.drawImage(cropImgEl, -rotW / 2, -rotH / 2, rotW, rotH);
  }
  rctx.restore();

  const cw = Math.max(1, Math.round(cropRect.w)), ch = Math.max(1, Math.round(cropRect.h));
  const cropCanvas = document.createElement("canvas");
  cropCanvas.width = cw; cropCanvas.height = ch;
  cropCanvas.getContext("2d").drawImage(rotCanvas, cropRect.x, cropRect.y, cw, ch, 0, 0, cw, ch);

  const target = cropTarget;
  if (target === "receipt") scanReceiptPhoto = makeReceiptThumbnail(cropCanvas, 480);
  const dataUrl = grayscaleContrastFromCanvas(cropCanvas, 2400);
  showCropTool = false;
  cropImgEl = null;
  render();
  if (target === "payslip") runPayslipOCRFromDataUrl(dataUrl);
  else if (target === "halal") runHalalOCRFromDataUrl(dataUrl);
  else runOCRFromDataUrl(dataUrl);
}

async function runPayslipOCRFromDataUrl(dataUrl) {
  scanning = true; scanProgress = 0; render();
  try {
    const Tesseract = await loadTesseract();
    const worker = await Tesseract.createWorker("eng+jpn", 1, {
      logger: (m) => {
        if (m.status === "recognizing text" && typeof m.progress === "number") {
          scanProgress = Math.round(m.progress * 100);
          const pctEl = document.getElementById("scanProgressPct");
          if (pctEl) pctEl.textContent = scanProgress + "%";
        }
      },
    });
    // tessedit_pageseg_mode "6" = anggap ini SATU BLOK teks seragam (bukan halaman kompleks
    // multi-kolom). Foto yg masuk sini udah lolos crop tool (dipotong pas ke area teks aja),
    // jadi asumsi "satu blok" ini akurat & bikin Tesseract gak perlu nebak-nebak layout (mode
    // default/PSM 3), yg sering keliru urutan baca kalau ada noise visual di sekitar teks.
    await worker.setParameters({ preserve_interword_spaces: "1", user_defined_dpi: "300", tessedit_pageseg_mode: "6" });
    const { data } = await worker.recognize(dataUrl);
    await worker.terminate();
    const { fields, monthKey: mk } = extractPayslipFields(data && data.text);
    scanning = false;
    if (fields.net === undefined && fields.gross === undefined) {
      render();
      alert(t("payslipNotFound"));
      return;
    }
    payslipDraft = {
      fields,
      monthKey: mk || monthKey(new Date()),
      chosenKey: fields.net !== undefined ? "net" : "gross",
    };
    showPayslipResult = true;
    render();
  } catch (e) {
    scanning = false;
    render();
    alert(t("scanFailed"));
  }
}

async function runOCRFromDataUrl(dataUrl) {
  scanning = true; scanProgress = 0; render();
  try {
    const Tesseract = await loadTesseract();
    const worker = await Tesseract.createWorker("eng+jpn", 1, {
      logger: (m) => {
        if (m.status === "recognizing text" && typeof m.progress === "number") {
          scanProgress = Math.round(m.progress * 100);
          const pctEl = document.getElementById("scanProgressPct");
          if (pctEl) pctEl.textContent = scanProgress + "%";
        }
      },
    });
    // preserve_interword_spaces: jaga jarak spasi antara nama barang & harga apa adanya,
    // biar pola "nama ... harga" di satu baris lebih gampang ke-parse dgn benar.
    // user_defined_dpi: foto kamera HP gak punya metadata DPI wajar (beda sama dokumen ke-scan),
    // kasih tau Tesseract "anggap ini 300 DPI" biar akurasi bacanya lebih stabil.
    // tessedit_pageseg_mode "6" = anggap ini SATU BLOK teks seragam (bukan halaman kompleks
    // multi-kolom). Foto yg masuk sini udah lolos crop tool (dipotong pas ke area teks aja),
    // jadi asumsi "satu blok" ini akurat & bikin Tesseract gak perlu nebak-nebak layout (mode
    // default/PSM 3), yg sering keliru urutan baca kalau ada noise visual di sekitar teks.
    await worker.setParameters({ preserve_interword_spaces: "1", user_defined_dpi: "300", tessedit_pageseg_mode: "6" });
    const { data } = await worker.recognize(dataUrl);
    await worker.terminate();

    const text = data && data.text;
    const items = extractItemsFromText(text);
    scanning = false;

    // Item picker SELALU dibuka setelah scan — gak ada lagi jalur diam-diam "langsung ke total".
    // Kalau parsing per-barang berhasil sebagian/semua, pakai itu. Kalau gagal total, tetap buka
    // picker dgn 1 baris "Total Struk" (dari nominal yg kebaca) atau kosong — user bisa edit/tambah manual.
    let finalItems;
    if (items.length >= 1) {
      const isExclusiveTax = detectAddedTax(text, items);
      scanIncludeTax = !isExclusiveTax;
      finalItems = items.map((it, i) => ({
        id: "it" + i, label: it.label, price: it.price, checked: true, taxRate: it.taxRate,
      }));
    } else {
      scanIncludeTax = true;
      const amt = extractAmountFromText(text);
      finalItems = amt ? [{ id: "it0", label: t("scanFallbackLabel"), price: amt, checked: true, taxRate: guessTaxRate("") }] : [];
    }
    scanItems = finalItems;
    showItemPicker = true;
    render();
  } catch (e) {
    scanning = false;
    render();
    alert(t("scanFailed"));
  }
}

load();
if (isIOS() && !isStandalone() && !isInstallDismissed()) {
  showInstallBanner = true;
  installBannerKind = "ios";
}
render();

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone() && !isInstallDismissed()) {
    showInstallBanner = true;
    installBannerKind = "android";
    render();
  }
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  showInstallBanner = false;
  render();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      // paksa cek update tiap kali app dibuka, biar gak nyangkut di versi lama
      reg.update().catch(() => {});
    }).catch(() => {});
  });
  // kalau ada versi baru yg baru aja ambil alih kontrol, reload sekali biar app kepake versi terbaru
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
