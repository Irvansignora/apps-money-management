<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>帳簿 — Japan Work Ledger</title>
<meta name="description" content="Track income & expenses while working in Japan, auto-converted to your home currency.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17233d">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="帳簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#17233d; --ai-2:#223a5c; --washi:#ece3ce; --washi-2:#e2d6b7;
    --sumi:#2a251d; --hanko:#ac3527; --hanko-2:#c9432f; --kabocha:#d9822f; --mist:#7c8ba3; --line:#c8bd9c;
    --card:#fbf7ea; --shadow-sm:0 1px 2px rgba(42,37,29,.06), 0 1px 1px rgba(42,37,29,.04);
    --shadow-md:0 8px 20px -8px rgba(42,37,29,.18); --shadow-lg:0 20px 40px -16px rgba(23,35,61,.35);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--washi);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 28px);
    color:var(--sumi);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;padding-bottom:100px;position:relative;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .display{font-family:'Shippori Mincho',serif;}
  button{font-family:inherit;}
  button:active{transform:scale(.96);}
  button{transition:transform .15s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), opacity .18s var(--ease);}

  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}55%{transform:scale(.92) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(var(--rot));opacity:1;}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes sheetUp{0%{transform:translateY(100%);}100%{transform:translateY(0);}}
  @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

  .cover{
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(217,130,47,.22) 0%, transparent 55%),
      radial-gradient(90% 70% at 0% 100%, rgba(255,255,255,.06) 0%, transparent 60%),
      linear-gradient(150deg,#17233d 0%,#26365c 55%,#1b2a4a 100%);
    color:#eee6d2; padding:28px 20px 26px; border-radius:0 0 28px 28px;
    box-shadow:var(--shadow-lg); position:relative; overflow:hidden;
  }
  .cover-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b9c2d6;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .install-banner{position:sticky;top:0;z-index:60;background:rgba(15,26,48,.92);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);color:#eee6d2;display:flex;align-items:center;gap:10px;
    padding:10px 14px;font-size:12.5px;box-shadow:0 2px 14px rgba(0,0,0,.3);animation:riseIn .35s var(--ease) both;}
  .install-banner img{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:block;}
  .install-banner .txt{flex:1;line-height:1.32;}
  .install-banner .install-go{background:var(--hanko);color:#fff5e8;border:none;border-radius:999px;
    padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer;flex:0 0 auto;white-space:nowrap;}
  .install-banner .install-close{background:none;border:none;color:#c7cede;cursor:pointer;padding:4px;
    font-size:16px;line-height:1;flex:0 0 auto;}
  .install-app-btn{width:100%;margin-top:10px;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:999px;
    border:1.5px dashed var(--line);background:transparent;color:var(--sumi);cursor:pointer;}
  .avatar-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.1);color:#eadfc4;display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;padding:0;text-transform:none;letter-spacing:0;}
  .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover-greeting{font-size:12px;color:#c7cede;margin:2px 0 0;}
  .profile-photo-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .profile-photo{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:#efe7d2;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
    font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;color:var(--mist);}
  .profile-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-actions{display:flex;flex-direction:column;gap:6px;}
  .photo-btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:var(--sumi);cursor:pointer;}
  .photo-btn.remove{color:var(--hanko);border-color:var(--hanko);background:transparent;}
  .cover-title{font-size:27px;font-weight:700;margin:6px 0 20px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.2px;}
  .cover-title span.jp{font-size:31px;}
  .cover-balance-label{font-size:12px;color:#9fabc4;margin-bottom:2px;}
  .cover-balance{font-size:39px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:baseline;gap:6px;}
  .cover-balance .unit{font-size:17px;color:#c7cede;font-weight:500;}
  .cover-balance-idr{margin-top:4px;font-size:14px;color:#c3d4ab;}
  .kurs-chip{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;font-size:12px;color:#eadfc4;cursor:pointer;}
  .kurs-chip:active{transform:scale(.97);}

  .summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0;}
  .sum-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
    box-shadow:var(--shadow-sm);animation:riseIn .4s var(--ease) both;}
  .sum-card .label{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .sum-card .val{font-size:18px;font-weight:600;}
  .sum-card.income .val{color:#8a6f18;}
  .sum-card.expense .val{color:var(--hanko);}

  .section{padding:20px 16px 0;}
  .section-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px 12px;box-shadow:var(--shadow-sm);}
  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:132px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-col .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .chart-col .bar{width:9px;border-radius:4px 4px 0 0;min-height:2px;transition:height .5s var(--ease);}
  .chart-col .bar.masuk{background:linear-gradient(180deg,#e6994a,#d9822f);}
  .chart-col .bar.keluar{background:linear-gradient(180deg,#c1483a,#ac3527);}
  .chart-col .lbl{font-size:11px;color:var(--mist);margin-top:6px;}
  .chart-legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:11px;color:var(--mist);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .month-scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:16px -16px 0;}
  .month-scroller::-webkit-scrollbar{display:none;}
  .month-pill{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:12px;padding:7px 13px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--sumi);cursor:pointer;transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);}
  .month-pill.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;box-shadow:var(--shadow-sm);}

  .ledger-filter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px;}
  .filter-btn{padding:8px 6px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--sumi);
    font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
    transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);}
  .filter-btn.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;box-shadow:var(--shadow-sm);}
  .filter-btn.active.f-income{background:var(--kabocha);border-color:var(--kabocha);}
  .filter-btn.active.f-expense{background:var(--hanko);border-color:var(--hanko);}

  .ledger{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .ledger-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px dashed var(--line);animation:riseIn .3s var(--ease) both;transition:background .15s;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row:active{background:rgba(42,37,29,.03);}

  .hanko{--rot:0deg;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--hanko);
    display:flex;align-items:center;justify-content:center;color:var(--hanko);font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:17px;transform:rotate(var(--rot));position:relative;}
  .hanko::after{content:"";position:absolute;inset:3px;border:1px solid var(--hanko);border-radius:50%;opacity:.55;}
  .hanko.income{border-color:var(--kabocha);color:var(--kabocha);}
  .hanko.income::after{border-color:var(--kabocha);}
  .hanko.stamp-in{animation:stampIn .6s cubic-bezier(.2,1.5,.4,1) both;}

  .ledger-mid{flex:1;min-width:0;}
  .ledger-cat{font-size:13px;font-weight:600;}
  .ledger-note{font-size:12px;color:var(--mist);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ledger-date{font-size:11px;color:var(--mist);margin-top:1px;}

  .ledger-right{text-align:right;flex:0 0 auto;}
  .ledger-amount{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;}
  .ledger-amount.income{color:#8a6f18;}
  .ledger-amount.expense{color:var(--hanko);}
  .trash-btn{margin-top:4px;background:none;border:none;padding:2px;color:var(--mist);cursor:pointer;opacity:.6;}
  .trash-btn:hover{opacity:1;color:var(--hanko);}

  .empty-state{padding:38px 20px;text-align:center;color:var(--mist);}
  .empty-state .stamp-outline{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;border:2px dashed var(--mist);
    display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:22px;animation:pulse 2.4s ease-in-out infinite;}

  .fab{position:fixed;bottom:22px;right:18px;width:58px;height:58px;border-radius:50%;
    background:linear-gradient(150deg,var(--hanko-2),var(--hanko));
    color:#fff5e8;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 24px -8px rgba(172,53,39,.6), 0 0 0 6px rgba(172,53,39,.08);cursor:pointer;z-index:30;font-size:27px;line-height:1;}
  .fab:active{transform:scale(0.92);}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(23,35,61,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    z-index:40;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s var(--ease) both;}
  .sheet-backdrop.open{display:flex;}
  .sheet{width:100%;max-width:480px;background:var(--washi);border-radius:24px 24px 0 0;padding:10px 18px 28px;
    animation:sheetUp .32s var(--ease) both;max-height:90vh;overflow-y:auto;box-shadow:0 -20px 40px -20px rgba(23,35,61,.4);}
  .sheet::before{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px;opacity:.8;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-title{font-family:'Shippori Mincho',serif;font-size:18.5px;font-weight:700;}
  .close-btn{background:rgba(42,37,29,.06);border:none;color:var(--sumi);cursor:pointer;padding:6px;width:30px;height:30px;
    border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center;}

  .scan-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;
    border:1.5px dashed var(--kabocha);background:rgba(217,130,47,.08);color:#8a5518;font-weight:700;font-size:13.5px;
    cursor:pointer;margin-bottom:16px;}
  .scan-btn .ic{font-size:16px;}
  .scan-overlay{position:fixed;inset:0;z-index:70;background:rgba(23,35,61,.72);backdrop-filter:blur(3px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#eee6d2;text-align:center;padding:24px;}
  .scan-spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(238,230,212,.25);
    border-top-color:#eadfc4;animation:spin .8s linear infinite;}
  .scan-overlay .sub{font-size:12px;color:#b9c2d6;max-width:280px;}

  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .type-btn{padding:11px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-weight:600;
    font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sumi);
    transition:background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease);}
  .type-btn.active.income{background:var(--kabocha);border-color:var(--kabocha);color:#fff;box-shadow:var(--shadow-sm);}
  .type-btn.active.expense{background:var(--hanko);border-color:var(--hanko);color:#fff;box-shadow:var(--shadow-sm);}

  .field-label{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .amount-input-wrap{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;background:#fff;transition:border-color .2s;}
  .amount-input-wrap:focus-within{border-color:var(--ai);}
  .amount-input-wrap span{font-family:'Shippori Mincho',serif;font-size:20px;color:var(--mist);}
  .amount-input-wrap input{border:none;outline:none;flex:1;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;background:transparent;width:100%;}
  .amount-idr-hint{font-size:12px;color:var(--mist);margin-top:4px;}

  .cat-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .cat-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;
    font-size:12.5px;background:#fff;cursor:pointer;transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), transform .12s;}
  .cat-chip:active{transform:scale(.95);}
  .cat-chip .k{font-family:'Shippori Mincho',serif;}
  .cat-chip.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;box-shadow:var(--shadow-sm);}

  .text-input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;font-family:'Inter',sans-serif;
    font-size:14px;background:#fff;outline:none;transition:border-color .2s;}
  .text-input:focus{border-color:var(--ai);}

  .submit-btn{margin-top:22px;width:100%;padding:14px;border-radius:14px;border:none;
    background:linear-gradient(150deg,var(--ai-2),var(--ai));color:#eee6d2;
    font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(23,35,61,.5);}

  /* toggle switch (split bill) */
  .switch{position:relative;display:inline-block;width:40px;height:23px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:999px;transition:background .2s var(--ease);}
  .switch .slider::before{content:"";position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .slider{background:var(--hanko);}
  .switch input:checked + .slider::before{transform:translateX(17px);}

  .split-box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:8px;animation:riseIn .25s var(--ease) both;}
  .split-row{display:flex;align-items:center;gap:12px;}
  .split-step{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--washi);
    color:var(--sumi);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .split-count{font-size:17px;font-weight:700;min-width:22px;text-align:center;}
  .split-label{font-size:12.5px;color:var(--mist);}
  .split-share{margin-top:10px;font-size:13px;color:var(--sumi);background:var(--washi);border-radius:10px;padding:8px 10px;}
  .split-share b{color:var(--hanko);}
  .split-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .split-mode-btn{padding:8px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:12px;
    font-weight:600;color:var(--sumi);cursor:pointer;}
  .split-mode-btn.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;}

  .item-list{max-height:42vh;overflow-y:auto;background:#fff;border:1.5px solid var(--line);border-radius:14px;margin-top:4px;}
  .item-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px dashed var(--line);cursor:pointer;}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type="checkbox"]{width:19px;height:19px;accent-color:var(--hanko);flex:0 0 auto;}
  .item-label{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-price{font-size:13px;font-weight:600;flex:0 0 auto;}
  .item-price-block{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto;}
  .item-tax-toggle{display:flex;gap:4px;}
  .tax-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--washi);color:var(--mist);cursor:pointer;}
  .tax-chip.active{background:var(--kabocha);border-color:var(--kabocha);color:#fff;}
  .tax-note{font-size:11px;color:var(--mist);margin:8px 2px 0;line-height:1.4;}
  .add-item-btn{width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1.5px dashed var(--line);
    background:transparent;color:var(--sumi);font-size:12.5px;font-weight:600;cursor:pointer;}
  .item-total-bar{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:12px 14px;
    background:var(--card);border:1.5px solid var(--line);border-radius:13px;font-size:13.5px;font-weight:600;}
  .item-total-bar span:last-child{font-size:17px;color:var(--hanko);}

  .icon{display:inline-flex;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------------
   帳簿 — Japan Work Ledger (versi deploy, vanilla JS, no build step)
   Data disimpan di localStorage browser masing-masing device.
--------------------------------------------------------------------- */

const INCOME_CATS = [
  { id: "gaji", kanji: "給" },
  { id: "lembur", kanji: "残" },
  { id: "bonus", kanji: "賞" },
  { id: "lain_masuk", kanji: "他" },
];
const EXPENSE_CATS = [
  { id: "makan", kanji: "食" },
  { id: "asrama", kanji: "住" },
  { id: "transport", kanji: "交" },
  { id: "kirim", kanji: "送" },
  { id: "pajak", kanji: "税" },

function load() {
  try {
    const txRaw = localStorage.getItem("jp-finance-transactions");
    if (txRaw) transactions = JSON.parse(txRaw);
  } catch (e) {}
  try {
    const r = localStorage.getItem("jp-finance-rates");
    if (r) rates = JSON.parse(r);
  } catch (e) {}
  try {
    const c = localStorage.getItem("jp-finance-currency");
    if (c) currency = c;
  } catch (e) {}
  try {
    const p = localStorage.getItem("jp-finance-profile");
    if (p) profile = Object.assign({ name: "", note: "", photo: "" }, JSON.parse(p));
  } catch (e) {}
  try {
    const l = localStorage.getItem("jp-finance-lang");
    if (l && LANGUAGES.some(x => x.code === l)) lang = l;
  } catch (e) {}
  // migrasi dari versi lama yang cuma simpan kurs IDR tunggal
  try {
    const oldKurs = localStorage.getItem("jp-finance-kurs");
    if (oldKurs && rates.IDR === undefined) rates.IDR = Number(oldKurs);
  } catch (e) {}
}

// resize+compress foto profil ke max 240x240 biar hemat localStorage
function readAndResizeImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function totalYen() { return transactions.reduce((s,t)=> s + (t.type==="income"? t.amount : -t.amount), 0); }
function monthsPresent() {
  const set = new Set(transactions.map(t => monthKey(new Date(t.date))));
  set.add(monthKey(new Date()));
  return Array.from(set).sort().reverse();
}
function monthTx() { return transactions.filter(t => monthKey(new Date(t.date)) === selectedMonth); }
function chartData() {
  const now = new Date(); const out = [];
  for (let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = monthKey(d);
    const inc = transactions.filter(t=>t.type==="income" && monthKey(new Date(t.date))===key).reduce((s,t)=>s+t.amount,0);
    const exp = transactions.filter(t=>t.type==="expense" && monthKey(new Date(t.date))===key).reduce((s,t)=>s+t.amount,0);
    out.push({ name: monthLabel(d.getMonth()), masuk: inc, keluar: exp });
  }
  return out;
}

      <div class="cover-balance-label">${esc(t("balanceLabel"))}</div>
      <div class="cover-balance mono"><span class="unit">¥</span>${yenFmt.format(totalYen())}</div>
      <div class="cover-balance-idr mono">≈ ${getCurrency().symbol} ${fmtMoney(Math.round(totalYen()*getRate()))}</div>
      <div class="kurs-chip" id="kursChip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 7h10M17 7v10M17 7L7 17" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="mono">${getCurrency().flag} 1¥ = ${getCurrency().symbol}${getRate()}</span><span style="opacity:.6">&nbsp;· ${esc(t("editInSettings"))}</span>
      </div>
    </div>

    <div class="summary-row">
      <div class="sum-card income">
        <div class="label">↑ ${esc(t("incomeThisMonth"))}</div>
        <div class="val mono">¥${yenFmt.format(mIncome)}</div>
      </div>
      <div class="sum-card expense">
        <div class="label">↓ ${esc(t("expenseThisMonth"))}</div>
        <div class="val mono">¥${yenFmt.format(mExpense)}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">${esc(t("trend6mo"))}</div>
      <div class="chart-card">
        <div class="chart-bars">
          ${cd.map(c => `
            <div class="chart-col">
              <div class="bars">
                <div class="bar masuk" style="height:${Math.max(2,(c.masuk/maxVal)*100)}%" title="${esc(t('income'))} ¥${yenFmt.format(c.masuk)}"></div>
                <div class="bar keluar" style="height:${Math.max(2,(c.keluar/maxVal)*100)}%" title="${esc(t('expense'))} ¥${yenFmt.format(c.keluar)}"></div>
              </div>
              <div class="lbl">${c.name}</div>
            </div>
          `).join("")}
        </div>
        <div class="chart-legend">
          <span><i style="background:#d9822f"></i> ${esc(t("income"))}</span>
          <span><i style="background:#ac3527"></i> ${esc(t("expense"))}</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">${esc(t("ledgerTitle"))}</div>
      <div class="month-scroller">
        ${months.map(m => {
          const [y,mo] = m.split("-");
          return `<div class="month-pill ${m===selectedMonth?"active":""}" data-month="${m}">${monthLabel(parseInt(mo,10)-1)} ${y}</div>`;
        }).join("")}
      </div>
      <div class="ledger-filter">
        <button type="button" class="filter-btn ${ledgerFilter==="all"?"active":""}" data-filter="all">${esc(t("filterAll"))}</button>
        <button type="button" class="filter-btn f-income ${ledgerFilter==="income"?"active":""}" data-filter="income">↑ ${esc(t("income"))}</button>
        <button type="button" class="filter-btn f-expense ${ledgerFilter==="expense"?"active":""}" data-filter="expense">↓ ${esc(t("expense"))}</button>
      </div>
      <div class="ledger">
        ${sortedTx.length === 0 ? `
          <div class="empty-state">
            <div class="stamp-outline">印</div>
            ${esc(t("emptyTitle"))}<br>${esc(t("emptySub"))}
          </div>
        ` : sortedTx.map(tx => {
          const c = catInfo(tx.catId);
          const rot = hashRotate(tx.id);
          return `
            <div class="ledger-row">
              <div class="hanko ${tx.type} ${justAddedId===tx.id?"stamp-in":""}" style="--rot:${rot}deg">${c.kanji}</div>
              <div class="ledger-mid">
                <div class="ledger-cat">${esc(catLabel(c.id))}</div>
                ${tx.note ? `<div class="ledger-note">${esc(tx.note)}</div>` : ""}
                <div class="ledger-date mono">${esc(tx.date)}</div>
              </div>
              <div class="ledger-right">
                <div class="ledger-amount ${tx.type}">${tx.type==="income"?"+":"−"}¥${yenFmt.format(tx.amount)}</div>
                <button class="trash-btn" data-del="${tx.id}" aria-label="${esc(t("deleteAria"))}">✕</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>

    <button class="fab" id="fabBtn" aria-label="${esc(t("addTxAria"))}">+</button>

    <div class="sheet-backdrop ${showForm?"open":""}" id="sheetBackdrop">
      <div class="sheet" id="sheetInner">
        <div class="sheet-head">
          <div class="sheet-title">${esc(t("newTxTitle"))}</div>
          <button class="close-btn" id="closeSheet" aria-label="${esc(t("closeAria"))}">✕</button>
        </div>
        <form id="txForm">
          <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none;">
          <button type="button" class="scan-btn" id="scanReceiptBtn"><span class="ic">📷</span> ${esc(t("scanBtn"))}</button>

          <div class="type-toggle">
            <button type="button" class="type-btn income ${form.type==="income"?"active":""}" data-type="income">${esc(t("incomeBtn"))}</button>
            <button type="button" class="type-btn expense ${form.type==="expense"?"active":""}" data-type="expense">${esc(t("expenseBtn"))}</button>
          </div>
          <div class="field-label">${esc(t("amountLabel"))}</div>
          <div class="amount-input-wrap">
            <span>¥</span>
            <input id="amountInput" inputmode="numeric" placeholder="0" value="${esc(form.amount)}" required>
          </div>
          <div class="amount-idr-hint mono" id="idrHint">${form.amount ? "≈ " + getCurrency().symbol + " " + fmtMoney(Math.round((parseInt(form.amount,10)||0)*getRate())) : ""}</div>

          <div class="field-label">${esc(t("categoryLabel"))}</div>
          <div class="cat-grid" id="catGrid">
            ${cats.map(c => `<div class="cat-chip ${form.catId===c.id?"active":""}" data-cat="${c.id}"><span class="k">${c.kanji}</span> ${esc(catLabel(c.id))}</div>`).join("")}
          </div>

          ${form.type === "expense" ? `
            <div class="field-label" style="margin-top:16px;">
              <span>${esc(t("splitBillLabel"))}</span>
              <label class="switch"><input type="checkbox" id="splitToggle" ${form.split?"checked":""}><span class="slider"></span></label>
            </div>
            ${form.split ? `
              <div class="split-box">
                <div class="split-row">
                  <button type="button" class="split-step" id="splitMinus">−</button>
                  <div class="split-count mono">${form.splitCount}</div>
                  <button type="button" class="split-step" id="splitPlus">+</button>
                  <div class="split-label">${esc(t("people"))}</div>
                </div>
                <div class="split-share mono">${esc(t("perPerson"))}: <b>¥${yenFmt.format(Math.round((parseInt(form.amount,10)||0)/form.splitCount))}</b></div>
                <div class="split-mode">
                  <button type="button" class="split-mode-btn ${form.splitMode==="mine"?"active":""}" data-split-mode="mine">${esc(t("myShareOnly"))}</button>
                  <button type="button" class="split-mode-btn ${form.splitMode==="full"?"active":""}" data-split-mode="full">${esc(t("fullAmount"))}</button>
                </div>
              </div>
            ` : ""}
          ` : ""}

          <div class="field-label">${esc(t("dateLabel"))}</div>
          <input type="date" class="text-input" id="dateInput" value="${esc(form.date)}">

          <div class="field-label">${esc(t("noteLabel"))}</div>
          <input type="text" class="text-input" id="noteInput" placeholder="${esc(t("notePlaceholder"))}" value="${esc(form.note)}">

          <button type="submit" class="submit-btn">${esc(t("submitTx"))}</button>
        </form>
      </div>
    </div>

    <div class="sheet-backdrop ${showItemPicker?"open":""}" id="itemPickerBackdrop">
      <div class="sheet" id="itemPickerInner">
        <div class="sheet-head">
          <div class="sheet-title">${esc(t("pickItemsTitle"))}</div>
          <button class="close-btn" id="closeItemPicker" aria-label="${esc(t("closeAria"))}">✕</button>
        </div>
        <div style="font-size:12px;color:var(--mist);margin-bottom:12px;line-height:1.4;">${esc(t("pickItemsSub"))}</div>

        <div class="field-label" style="margin:0 0 4px;">
          <span>${esc(t("pricesIncludeTax"))}</span>
          <label class="switch"><input type="checkbox" id="includeTaxToggle" ${scanIncludeTax?"checked":""}><span class="slider"></span></label>
        </div>
        <div class="tax-note">${esc(t("taxLawNote"))}</div>

        <div class="item-list" id="itemList" style="margin-top:12px;">
          ${(scanItems||[]).length === 0 ? `
            <div style="padding:18px 14px;text-align:center;font-size:12.5px;color:var(--mist);line-height:1.4;">${esc(t("scanEmptyHint"))}</div>
          ` : (scanItems||[]).map(it => scanIncludeTax ? `
            <label class="item-row">
              <input type="checkbox" data-item="${it.id}" ${it.checked?"checked":""}>
              <span class="item-label">${esc(it.label)}</span>
              <span class="item-price mono">¥${yenFmt.format(it.price)}</span>
            </label>
          ` : `
            <div class="item-row">
              <input type="checkbox" data-item="${it.id}" ${it.checked?"checked":""}>
              <span class="item-label">${esc(it.label)}</span>
              <div class="item-price-block">
                <span class="item-price mono">¥${yenFmt.format(it.price)}</span>
                <div class="item-tax-toggle">
                  <button type="button" class="tax-chip ${it.taxRate===8?"active":""}" data-tax="${it.id}" data-rate="8">8%</button>
                  <button type="button" class="tax-chip ${it.taxRate===10?"active":""}" data-tax="${it.id}" data-rate="10">10%</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
        ${!scanIncludeTax ? `<div class="tax-note">${esc(t("taxAddedNote"))}</div>` : ""}
        <button type="button" class="add-item-btn" id="addItemBtn">${esc(t("addItemManually"))}</button>
        <div class="item-total-bar">
          <span>${esc(t("selectedTotal"))}</span>
          <span class="mono" id="itemTotalVal">¥${yenFmt.format(computeItemTotal())}</span>
        </div>
        <button type="button" class="submit-btn" id="useItemTotalBtn">${esc(t("useThisAmount"))}</button>
      </div>
    </div>

    <div class="sheet-backdrop ${showSettings?"open":""}" id="settingsBackdrop">
      <div class="sheet" id="settingsSheetInner">
        <div class="sheet-head">
          <div class="sheet-title">${esc(t("settingsTitle"))}</div>
          <button class="close-btn" id="closeSettingsSheet" aria-label="${esc(t("closeAria"))}">✕</button>
        </div>
        <form id="settingsForm">
          <div class="field-label">${esc(t("profileSection"))}</div>
          <div class="profile-photo-row">
            <div class="profile-photo">${settingsForm.photo ? `<img src="${settingsForm.photo}" alt="">` : esc(initials(settingsForm.name))}</div>
            <div class="photo-actions">
              <label class="photo-btn" for="photoInput" style="text-align:center;">🖼️ ${settingsForm.photo ? esc(t("photoChange")) : esc(t("photoAdd"))}</label>
              <input type="file" id="photoInput" accept="image/*" style="display:none;">
              ${settingsForm.photo ? `<button type="button" class="photo-btn remove" id="removePhotoBtn">${esc(t("photoRemove"))}</button>` : ""}
            </div>
          </div>
          <div class="field-label">${esc(t("nameLabel"))}</div>
          <input type="text" class="text-input" id="settingsNameInput" placeholder="${esc(t("namePlaceholder"))}" value="${esc(settingsForm.name)}" style="margin-bottom:8px;">
          <div class="field-label">${esc(t("noteLabel"))}</div>
          <input type="text" class="text-input" id="settingsNoteInput" placeholder="${esc(t("profileNotePlaceholder"))}" value="${esc(settingsForm.note)}">

          <div class="field-label" style="margin-top:18px;">${esc(t("languageSection"))}</div>
          <div class="cat-grid" id="langGrid">
            ${LANGUAGES.map(l => `<div class="cat-chip ${settingsForm.lang===l.code?"active":""}" data-lang="${l.code}"><span class="k">${l.flag}</span> ${esc(l.label)}</div>`).join("")}
          </div>

          <div class="field-label" style="margin-top:18px;">${esc(t("currencySection"))}</div>
          <div class="cat-grid" id="currencyGrid">
            ${CURRENCIES.map(c => `<div class="cat-chip ${settingsForm.currency===c.code?"active":""}" data-currency="${c.code}"><span class="k">${c.flag}</span> ${c.code}</div>`).join("")}
          </div>
          <div class="amount-input-wrap" style="margin-top:10px;">
            <span class="mono" style="font-size:15px;">1¥ =</span>
            <input id="settingsRateInput" class="mono" value="${esc(settingsForm.rate)}">
            <span class="mono" style="font-size:15px;">${(CURRENCIES.find(c=>c.code===settingsForm.currency)||CURRENCIES[0]).symbol}</span>
          </div>

          <button type="submit" class="submit-btn">${esc(t("saveSettings"))}</button>
          ${(deferredInstallPrompt || installBannerKind === "ios") && !isStandalone() ? `
            <button type="button" class="install-app-btn" id="installAppSettingsBtn">${esc(t("installAppBtn"))}</button>
          ` : ""}
        </form>
      </div>
    </div>
    ${scanning ? `
      <div class="scan-overlay" id="scanOverlay">
        <div class="scan-spinner"></div>
        <div>${esc(t("scanReading"))}</div>
        <div class="mono" id="scanProgressPct" style="font-size:22px;font-weight:700;">${scanProgress}%</div>
        <div class="sub">${esc(t("scanSub"))}</div>
      </div>
    ` : ""}
  `;

  attachEvents();
}

function attachEvents() {
  const app = document.getElementById("app");

  const installGoBtn = document.getElementById("installGoBtn");
  if (installGoBtn) {
    installGoBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      try {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
      } catch (e) {}
      deferredInstallPrompt = null;
      showInstallBanner = false;
      render();
    });
  }
  const installCloseBtn = document.getElementById("installCloseBtn");
  if (installCloseBtn) {
    installCloseBtn.addEventListener("click", () => {
      showInstallBanner = false;
      setInstallDismissed();
      render();
    });
  }
  const installAppSettingsBtn = document.getElementById("installAppSettingsBtn");
  if (installAppSettingsBtn) {
    installAppSettingsBtn.addEventListener("click", async () => {
      if (deferredInstallPrompt) {
        try {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
        } catch (e) {}
        deferredInstallPrompt = null;
        showInstallBanner = false;
        render();
      } else if (isIOS()) {
        showInstallBanner = true;
        installBannerKind = "ios";
        showSettings = false;
        render();
      }
    });
  }

  app.querySelectorAll(".month-pill").forEach(el => {
    el.addEventListener("click", () => { selectedMonth = el.dataset.month; render(); });
  });

  app.querySelectorAll("[data-filter]").forEach(el => {
    el.addEventListener("click", () => { ledgerFilter = el.dataset.filter; render(); });
  });

  app.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", () => {
      transactions = transactions.filter(t => t.id !== el.dataset.del);
      saveTx(); render();
    });
  });

  // buka sheet Pengaturan (dari tombol avatar ATAU dari chip kurs di cover)
  const openSettings = () => {
    settingsForm = {
      name: profile.name, note: profile.note, photo: profile.photo,
      lang: lang, currency: currency, rate: String(getRate()),
    };
    showSettings = true;
    render();
  };
  const settingsBtn = document.getElementById("settingsBtn");
  if (settingsBtn) settingsBtn.addEventListener("click", openSettings);
  const kursChip = document.getElementById("kursChip");
  if (kursChip) kursChip.addEventListener("click", openSettings);

  const closeSettingsSheet = document.getElementById("closeSettingsSheet");
  const settingsBackdrop = document.getElementById("settingsBackdrop");
  if (closeSettingsSheet) closeSettingsSheet.addEventListener("click", () => { showSettings = false; render(); });
  if (settingsBackdrop) settingsBackdrop.addEventListener("click", (e) => { if (e.target === settingsBackdrop) { showSettings = false; render(); } });
  const settingsSheetInner = document.getElementById("settingsSheetInner");
  if (settingsSheetInner) settingsSheetInner.addEventListener("click", e => e.stopPropagation());

  const photoInput = document.getElementById("photoInput");
  if (photoInput) {
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      try {
        settingsForm.photo = await readAndResizeImage(file, 240);
        render();
      } catch (e) {
        alert("Gagal memuat foto, coba foto lain ya. / Failed to load photo, try another one.");
      }
    });
  }
  const removePhotoBtn = document.getElementById("removePhotoBtn");
  if (removePhotoBtn) removePhotoBtn.addEventListener("click", () => { settingsForm.photo = ""; render(); });

  const settingsNameInput = document.getElementById("settingsNameInput");
  if (settingsNameInput) settingsNameInput.addEventListener("input", () => { settingsForm.name = settingsNameInput.value; });
  const settingsNoteInput = document.getElementById("settingsNoteInput");
  if (settingsNoteInput) settingsNoteInput.addEventListener("input", () => { settingsForm.note = settingsNoteInput.value; });
  const settingsRateInput = document.getElementById("settingsRateInput");
  if (settingsRateInput) settingsRateInput.addEventListener("input", () => { settingsForm.rate = settingsRateInput.value; });

  // pilih bahasa: klik chip langsung ubah draft & render ulang (sheet tetap terbuka)
  app.querySelectorAll("[data-lang]").forEach(el => {
    el.addEventListener("click", () => { settingsForm.lang = el.dataset.lang; render(); });
  });

  // pilih mata uang: klik chip, kurs terisi otomatis dari nilai tersimpan/default utk mata uang itu
  app.querySelectorAll("[data-currency]").forEach(el => {
    el.addEventListener("click", () => {
      const code = el.dataset.currency;
      settingsForm.currency = code;
      const cur = CURRENCIES.find(c => c.code === code) || CURRENCIES[0];
      settingsForm.rate = String(rates[code] !== undefined ? rates[code] : cur.rate);
      render();
    });
  });

  const settingsFormEl = document.getElementById("settingsForm");
  if (settingsFormEl) {
    settingsFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      profile = { name: (settingsForm.name||"").trim(), note: (settingsForm.note||"").trim(), photo: settingsForm.photo || "" };
      saveProfile();
      lang = settingsForm.lang || "id";
      saveLang();
      currency = settingsForm.currency || "IDR";
      const v = parseFloat(String(settingsForm.rate).replace(",", "."));
      if (v > 0) rates[currency] = v;
      saveRates();
      saveCurrency();
      showSettings = false;
      render();
    });
  }

  const fab = document.getElementById("fabBtn");
  if (fab) fab.addEventListener("click", () => { showForm = true; render(); });

  const closeSheet = document.getElementById("closeSheet");
  const backdrop = document.getElementById("sheetBackdrop");
  if (closeSheet) closeSheet.addEventListener("click", () => { showForm = false; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { showForm = false; render(); } });
  const sheetInner = document.getElementById("sheetInner");
  if (sheetInner) sheetInner.addEventListener("click", e => e.stopPropagation());

  app.querySelectorAll("[data-type]").forEach(el => {
    el.addEventListener("click", () => {
      form.type = el.dataset.type;
      form.catId = (form.type === "income" ? INCOME_CATS : EXPENSE_CATS)[0].id;
      if (form.type === "income") form.split = false;
      render();
      keepSheetOpen();
    });
  });

  app.querySelectorAll("[data-cat]").forEach(el => {
    el.addEventListener("click", () => { form.catId = el.dataset.cat; render(); keepSheetOpen(); });
  });

  const amountInput = document.getElementById("amountInput");
  if (amountInput) {
    amountInput.addEventListener("input", () => {
      form.amount = amountInput.value.replace(/[^0-9]/g, "");
      amountInput.value = form.amount;
      const hint = document.getElementById("idrHint");
      if (hint) hint.textContent = form.amount ? "≈ " + getCurrency().symbol + " " + fmtMoney(Math.round((parseInt(form.amount,10)||0)*getRate())) : "";
      if (form.split) {
        const shareEl = document.querySelector(".split-share b");
        if (shareEl) shareEl.textContent = "¥" + yenFmt.format(Math.round((parseInt(form.amount,10)||0)/form.splitCount));
      }
    });
  }
  const dateInput = document.getElementById("dateInput");
  if (dateInput) dateInput.addEventListener("change", () => { form.date = dateInput.value; });
  const noteInput = document.getElementById("noteInput");
  if (noteInput) noteInput.addEventListener("input", () => { form.note = noteInput.value; });

  // ---- split bill ----
  const splitToggle = document.getElementById("splitToggle");
  if (splitToggle) splitToggle.addEventListener("change", () => { form.split = splitToggle.checked; render(); keepSheetOpen(); });
  const splitMinus = document.getElementById("splitMinus");
  if (splitMinus) splitMinus.addEventListener("click", () => { form.splitCount = Math.max(2, form.splitCount - 1); render(); keepSheetOpen(); });
  const splitPlus = document.getElementById("splitPlus");
  if (splitPlus) splitPlus.addEventListener("click", () => { form.splitCount = Math.min(20, form.splitCount + 1); render(); keepSheetOpen(); });
  app.querySelectorAll("[data-split-mode]").forEach(el => {
    el.addEventListener("click", () => { form.splitMode = el.dataset.splitMode; render(); keepSheetOpen(); });
  });

  // ---- scan struk ----
  const scanReceiptBtn = document.getElementById("scanReceiptBtn");
  const receiptInput = document.getElementById("receiptInput");
  if (scanReceiptBtn && receiptInput) {
    scanReceiptBtn.addEventListener("click", () => receiptInput.click());
    receiptInput.addEventListener("change", () => {
      const file = receiptInput.files && receiptInput.files[0];
      receiptInput.value = "";
      if (file) handleReceiptFile(file);
    });
  }

  // ---- pemilih barang hasil scan ----
  const closeItemPicker = document.getElementById("closeItemPicker");
  const itemPickerBackdrop = document.getElementById("itemPickerBackdrop");
  const itemPickerInner = document.getElementById("itemPickerInner");
  const closeItemPickerFlow = () => { showItemPicker = false; scanItems = null; render(); };
  if (closeItemPicker) closeItemPicker.addEventListener("click", closeItemPickerFlow);
  if (itemPickerBackdrop) itemPickerBackdrop.addEventListener("click", (e) => { if (e.target === itemPickerBackdrop) closeItemPickerFlow(); });
  if (itemPickerInner) itemPickerInner.addEventListener("click", e => e.stopPropagation());

  app.querySelectorAll("[data-item]").forEach(el => {
    el.addEventListener("change", () => {
      const it = (scanItems||[]).find(x => x.id === el.dataset.item);
      if (it) it.checked = el.checked;
      const totalEl = document.getElementById("itemTotalVal");
      if (totalEl) totalEl.textContent = "¥" + yenFmt.format(computeItemTotal());
    });
  });

  const includeTaxToggle = document.getElementById("includeTaxToggle");
  if (includeTaxToggle) includeTaxToggle.addEventListener("change", () => { scanIncludeTax = includeTaxToggle.checked; render(); });

  app.querySelectorAll("[data-tax]").forEach(el => {
    el.addEventListener("click", () => {
      const it = (scanItems||[]).find(x => x.id === el.dataset.tax);
      if (it) it.taxRate = parseInt(el.dataset.rate, 10);
      render();
    });
  });

  const addItemBtn = document.getElementById("addItemBtn");
  if (addItemBtn) {
    addItemBtn.addEventListener("click", () => {
      const label = (prompt(t("addItemPromptLabel")) || "").trim();
      if (!label) return;
      const priceRaw = prompt(t("addItemPromptPrice")) || "";
      const price = parseInt(priceRaw.replace(/[^0-9]/g, ""), 10);
      if (!price || price <= 0) return;
      scanItems = scanItems || [];
      scanItems.push({ id: "it" + Date.now(), label, price, checked: true, taxRate: guessTaxRate(label) });
      render();
    });
  }

  const useItemTotalBtn = document.getElementById("useItemTotalBtn");
  if (useItemTotalBtn) {
    useItemTotalBtn.addEventListener("click", () => {
      form.amount = String(computeItemTotal());
      showItemPicker = false;
      scanItems = null;
      render();
    });
  }

  const txForm = document.getElementById("txForm");
  if (txForm) {
    txForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const rawAmt = parseInt(String(form.amount).replace(/[^0-9]/g, ""), 10);
      if (!rawAmt || rawAmt <= 0) return;
      let amt = rawAmt;
      let noteExtra = "";
      if (form.type === "expense" && form.split && form.splitCount > 1) {
        if (form.splitMode === "mine") amt = Math.max(1, Math.round(rawAmt / form.splitCount));
        noteExtra = ` (÷${form.splitCount}${form.splitMode === "mine" ? " · " + t("myShareOnly") : ""})`;
      }
      const noteFinal = ((form.note||"").trim() + noteExtra).trim();
      const tx = { id: uid(), type: form.type, catId: form.catId, amount: amt, date: form.date || new Date().toISOString().slice(0,10), note: noteFinal, createdAt: Date.now() };
      transactions.unshift(tx);
      saveTx();
      selectedMonth = monthKey(new Date(tx.date));
      justAddedId = tx.id;
      showForm = false;
      form = { type: "expense", catId: "makan", amount: "", date: new Date().toISOString().slice(0,10), note: "", split: false, splitCount: 2, splitMode: "mine" };
      render();
      setTimeout(() => { justAddedId = null; }, 900);
    });
  }
}

// ---- OCR scan struk (Tesseract.js, dimuat on-demand, jalan di browser, gak ada foto yg disimpan) ----
function loadTesseract() {
  return new Promise((resolve, reject) => {
    if (window.Tesseract) return resolve(window.Tesseract);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error("Gagal memuat pustaka OCR"));
    document.head.appendChild(s);
  });
}
function guessTaxRate(label) {
  // fallback kalau struk gak pakai penanda "*" sama sekali (jarang) — nebak dari nama barang
  const higherRate = /(beer|wine|sake|alcohol|whisky|whiskey|shochu|chuhai|highball|liquor|cigarette|tobacco|tissue|towel|battery|magazine|newspaper|umbrella|soap|shampoo|detergent|mask|cable|charger|ビール|酒|ワイン|チューハイ|ハイボール|タバコ|タオル|電池|雑誌|洗剤|マスク)/i;
  return higherRate.test(label) ? 10 : 8;
}
function computeItemTotal() {
  const checked = (scanItems||[]).filter(i => i.checked);
  if (scanIncludeTax) return checked.reduce((s, i) => s + i.price, 0);
  // pajak konsumsi Jepang dihitung dari SUBTOTAL GABUNGAN per kelompok tarif (baru di-floor),
  // bukan floor per-barang lalu dijumlah — dua cara ini bisa beda hasil krn floor gak linear.
  const sum8 = checked.filter(i => i.taxRate !== 10).reduce((s, i) => s + i.price, 0);
  const sum10 = checked.filter(i => i.taxRate === 10).reduce((s, i) => s + i.price, 0);
  return sum8 + sum10 + Math.floor(sum8 * 0.08) + Math.floor(sum10 * 0.10);
}
// deteksi gaya "外税" (pajak dipisah dari harga barang) dari POLA ANGKA di struk, per kelompok tarif (8%/10%)
// — gak bergantung OCR bisa baca kanji dgn benar, murni matematis.
function detectAddedTax(text, items) {
  const sum8 = items.filter(i => i.taxRate === 8).reduce((s,i) => s+i.price, 0);
  const sum10 = items.filter(i => i.taxRate === 10).reduce((s,i) => s+i.price, 0);
  const lines = String(text||"").split(/\n/);
  let matched = false;
  lines.forEach(line => {
    const pct = line.match(/(8|10)\s*%/);
    if (!pct) return;
    const nums = line.match(/[0-9][0-9,]{1,7}/g);
    if (!nums) return;
    const rate = parseInt(pct[1], 10);
    const base = rate === 8 ? sum8 : sum10;
    if (!base) return;
    const expected = Math.floor(base * rate / 100);
    nums.forEach(n => {
      const v = parseInt(n.replace(/,/g, ""), 10);
      if (!v || v <= 0 || v >= base) return;
      if (Math.abs(v - expected) <= Math.max(2, Math.round(expected * 0.04))) matched = true;
    });
  });
  return matched;
}
function extractAmountFromText(text) {
  const totalKeywords = /(合計|小計|総計|お会計|total|amount due|grand total)/i;
  const noiseLine = /(電話|tel\.?:|phone|\d{2,5}-\d{1,4}-\d{3,4}|年.{0,2}月.{0,2}日|\d{1,2}\s*:\s*\d{2})/i;
  const lines = String(text||"").split(/\n/);
  const fromTotalLine = [];
  lines.forEach(line => {
    if (noiseLine.test(line)) return; // baris telepon/tanggal-jam jangan pernah dianggap kandidat total
    if (totalKeywords.test(line)) {
      const nums = line.match(/[0-9][0-9,]{2,}/g);
      if (nums) nums.forEach(n => fromTotalLine.push(parseInt(n.replace(/,/g,""),10)));
    }
  });
  const valid = fromTotalLine.filter(v => v > 0 && v < 10000000);
  if (valid.length) return Math.max(...valid);
  const cleanLines = lines.filter(l => !noiseLine.test(l)).join("\n");
  const allNums = cleanLines.match(/[0-9][0-9,]{2,}/g);
  if (allNums) {
    const vals = allNums.map(n => parseInt(n.replace(/,/g,""),10)).filter(v => v > 0 && v < 10000000);
    if (vals.length) return Math.max(...vals);
  }
  return null;
}
// baris kayak "に . /" atau "を |" itu sampah OCR, bukan nama barang beneran — nama barang asli
// pasti punya minimal 2 karakter kana/kanji ATAU 3 huruf Latin. Ini nyaring banyak false-positive.
function isPlausibleLabel(label) {
  const cjk = (String(label).match(/[\u3040-\u30FF\u4E00-\u9FFF]/g) || []).length;
  const latin = (String(label).match(/[A-Za-z]/g) || []).length;
  return cjk >= 2 || latin >= 3;
}
function extractItemsFromText(text) {
  // pola keyword ringkasan/pajak — dicek di versi asli DAN versi tanpa-spasi, krn OCR kadang nyelipin
  // spasi aneh di antara karakter kanji (mis. "合 計" bukan "合計") yg bikin regex biasa gagal match.
  const skipPatterns = [
    /合\s*計/, /小\s*計/, /総\s*計/, /お\s*会\s*計/, /total/i, /subtotal/i, /change/i, /cash/i,
    /point/i, /tax/i, /税/, /預\s*り/, /釣/, /カード/, /クレジット/, /レシート/, /領収/, /no\./i,
    /receipt/i, /袋/, /fukuro/i, /bag/i,
    /電話/, /tel\.?:/i, /phone/i, /\d{2,5}-\d{1,4}-\d{3,4}/, // nomor telepon
    /年.{0,2}月.{0,2}日/, /責\s*\d/, // baris tanggal/kasir
    /現金/, /店数/, /点数/,
  ];
  const pctPattern = /\b(8|10)\s*%/;
  // baris "nama + [*] + harga" dalam satu baris — trailing {0,4} toleransi karakter noise OCR yg suka nyempil di ujung
  const priceLinePattern = /^(.{1,40}?[^\d,])\s+(\*)?\s*[¥\$\\]?\s*([0-9][0-9,]{1,7})(?:\s.{0,4})?$/;
  // baris lanjutan "@harga x qty ... [*] total" (format 2-baris)
  const continuationPattern = /^@?\s*[0-9][0-9,]*\s*[xX×]\s*[0-9]+\s+(\*)?\s*[¥\$\\]?\s*([0-9][0-9,]{1,7})(?:\s.{0,4})?$/;
  // baris yg isinya CUMA harga doang (opsional tanda * di depan) — muncul di format 3-baris
  const priceOnlyPattern = /^(\*)?\s*[¥\$\\]\s*([0-9][0-9,]{1,7})(?:\s.{0,4})?$/;
  const rawLines = String(text||"").split(/\n/).map(l => l.trim()).filter(Boolean);

  const items = [];
  let runningSum = 0;

  for (let idx = 0; idx < rawLines.length; idx++) {
    const line = rawLines[idx];
    const collapsed = line.replace(/\s+/g, "");
    const looksLikeSummary = skipPatterns.some(p => p.test(line) || p.test(collapsed)) || pctPattern.test(line);

    let label = null, price = null, hasAsterisk = false;

    const m = line.match(priceLinePattern);
    if (m && isPlausibleLabel(m[1])) {
      label = m[1].trim();
      hasAsterisk = !!m[2];
      price = parseInt(m[3].replace(/,/g, ""), 10);
    } else if (!looksLikeSummary && isPlausibleLabel(line) && line.length <= 40 && idx + 1 < rawLines.length) {
      // baris ini keliatan kayak nama barang beneran (lolos cek plausibilitas) tapi gak ada harga ->
      // cek 1-2 baris berikutnya. Format umum: "@satuan x qty ... total" (2-baris), atau
      // "nama" / "* doang atau *(rincian)" / "harga" (3-baris, mis. struk NICOT).
      const nextLine = rawLines[idx + 1];
      const nextCollapsed = nextLine.replace(/\s+/g, "");
      const nextLooksSummary = skipPatterns.some(p => p.test(nextLine) || p.test(nextCollapsed));
      if (!nextLooksSummary) {
        const cont = nextLine.match(continuationPattern);
        const po = nextLine.match(priceOnlyPattern);
        if (cont) {
          label = line; hasAsterisk = !!cont[1]; price = parseInt(cont[2].replace(/,/g, ""), 10); idx++;
        } else if (po) {
          label = line; hasAsterisk = !!po[1]; price = parseInt(po[2].replace(/,/g, ""), 10); idx++;
        } else if (idx + 2 < rawLines.length && nextLine.length <= 18 && /^\*?\s*(\([^)]*\))?\s*$/.test(nextLine)) {
          // baris tengah cuma "*" doang / "*(rincian satuan×qty)" tanpa total -> intip 1 baris lagi
          const thirdLine = rawLines[idx + 2];
          const thirdLooksSummary = skipPatterns.some(p => p.test(thirdLine));
          const po2 = thirdLine.match(priceOnlyPattern) || thirdLine.match(/^[¥\$\\]?\s*([0-9][0-9,]{1,7})(?:\s.{0,4})?$/);
          if (po2 && !thirdLooksSummary) {
            label = line;
            hasAsterisk = /\*/.test(nextLine) || !!po2[1];
            price = parseInt((po2[2] || po2[1]).replace(/,/g, ""), 10);
            idx += 2;
          }
        }
      }
    }

    if (price === null || !price || price <= 0 || price >= 1000000) continue;

    // deteksi baris subtotal via ANGKA: kalau harga baris ini = jumlah kumulatif barang sejauh ini -> stop.
    if (items.length > 0 && Math.abs(price - runningSum) <= 1) break;

    if (looksLikeSummary) continue;

    const cleanLabel = String(label).trim()
      .replace(/[*×xX]\s*\d+$/, "")
      .replace(/^(外|内)\s*(8|10)?\s*/, "")
      .replace(/^軽\s*/, "")
      .replace(/^\*\s*/, "")
      .trim();
    if (cleanLabel.length >= 1) {
      // taxRate: null dulu (belum tau pasti), diisi setelah loop selesai berdasarkan ada/tidaknya tanda * di struk ini
      items.push({ label: cleanLabel.slice(0, 40), price, taxRate: hasAsterisk ? 8 : null });
      runningSum += price;
    }
  }

  // kalau minimal 1 barang punya tanda "*", struk ini pakai konvensi resmi [*]=8%,
  // jadi SEMUA barang tanpa tanda * dianggap pasti 10% (bukan cuma tebakan kata kunci lagi).
  // Kalau gak ada satupun tanda * di seluruh struk, baru fallback ke tebakan nama barang.
  const anyAsterisk = items.some(i => i.taxRate === 8);
  items.forEach(i => {
    if (i.taxRate === null) i.taxRate = anyAsterisk ? 10 : guessTaxRate(i.label);
  });

  return items.slice(0, 25);
}
// kecilkan foto struk sebelum di-OCR — foto kamera HP biasanya 3000px+ & beberapa MB,
// itu bikin proses baca teks jauh lebih lambat di HP. Diperkecil ke max ~1600px gak ngurangin
// keterbacaan teks tapi mempercepat proses secara signifikan.
function downscaleForOCR(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        // grayscale + naikin kontras sebelum di-OCR — foto struk asli (warna, bayangan,
        // background gak rata) jauh lebih susah dibaca OCR drpd versi hitam-putih kontras tinggi.
        // Ini terbukti signifikan ningkatin akurasi baca pas diuji langsung.
        ctx.filter = "grayscale(1) contrast(1.35) brightness(1.05)";
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.92));
      };
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleReceiptFile(file) {
  scanning = true; scanProgress = 0; render();
  try {
    const [Tesseract, resized] = await Promise.all([
      loadTesseract(),
      downscaleForOCR(file, 2400),
    ]);
    const worker = await Tesseract.createWorker("eng+jpn", 1, {
      logger: (m) => {
        if (m.status === "recognizing text" && typeof m.progress === "number") {
          scanProgress = Math.round(m.progress * 100);
          const pctEl = document.getElementById("scanProgressPct");
          if (pctEl) pctEl.textContent = scanProgress + "%";
        }
      },
    });
    // preserve_interword_spaces: jaga jarak spasi antara nama barang & harga apa adanya,
    // biar pola "nama ... harga" di satu baris lebih gampang ke-parse dgn benar.
    await worker.setParameters({ preserve_interword_spaces: "1" });
    const { data } = await worker.recognize(resized);
    await worker.terminate();

    const text = data && data.text;
    const items = extractItemsFromText(text);
    scanning = false;

    // Item picker SELALU dibuka setelah scan — gak ada lagi jalur diam-diam "langsung ke total".
    // Kalau parsing per-barang berhasil sebagian/semua, pakai itu. Kalau gagal total, tetap buka
    // picker dgn 1 baris "Total Struk" (dari nominal yg kebaca) atau kosong — user bisa edit/tambah manual.
    let finalItems;
    if (items.length >= 1) {
      const isExclusiveTax = detectAddedTax(text, items);
      scanIncludeTax = !isExclusiveTax;
      finalItems = items.map((it, i) => ({
        id: "it" + i, label: it.label, price: it.price, checked: true, taxRate: it.taxRate,
      }));
    } else {
      scanIncludeTax = true;
      const amt = extractAmountFromText(text);
      finalItems = amt ? [{ id: "it0", label: t("scanFallbackLabel"), price: amt, checked: true, taxRate: guessTaxRate("") }] : [];
    }
    scanItems = finalItems;
    showItemPicker = true;
    render();
  } catch (e) {
    scanning = false;
    render();
    alert(t("scanFailed"));
  }
}
