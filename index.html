<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>帳簿 — Catatan Kerja Jepang</title>
<meta name="description" content="Catat pemasukan & pengeluaran kerja di Jepang, konversi otomatis ke mata uang negaramu.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17233d">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="帳簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#17233d; --ai-2:#223a5c; --washi:#ece3ce; --washi-2:#e2d6b7;
    --sumi:#2a251d; --hanko:#ac3527; --kabocha:#d9822f; --mist:#7c8ba3; --line:#c8bd9c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--washi);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.025) 0px, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 28px);
    color:var(--sumi);
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;padding-bottom:96px;position:relative;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .display{font-family:'Shippori Mincho',serif;}

  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0;}55%{transform:scale(.92) rotate(3deg);opacity:1;}100%{transform:scale(1) rotate(var(--rot));opacity:1;}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes sheetUp{0%{transform:translateY(100%);}100%{transform:translateY(0);}}

  .cover{
    background:linear-gradient(150deg,#17233d 0%,#26365c 55%,#1b2a4a 100%);
    color:#eee6d2; padding:28px 20px 26px; border-radius:0 0 26px 26px;
    box-shadow:0 14px 28px -14px rgba(23,35,61,.55); position:relative; overflow:hidden;
  }
  .cover::before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle, rgba(217,130,47,.28) 0%, transparent 70%);}
  .cover-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b9c2d6;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .avatar-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);color:#eadfc4;display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-size:14px;font-weight:700;cursor:pointer;overflow:hidden;padding:0;text-transform:none;letter-spacing:0;}
  .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover-greeting{font-size:12px;color:#c7cede;margin:2px 0 0;}
  .profile-photo-row{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .profile-photo{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:#efe7d2;
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
    font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;color:var(--mist);}
  .profile-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-actions{display:flex;flex-direction:column;gap:6px;}
  .photo-btn{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:#fff;color:var(--sumi);cursor:pointer;}
  .photo-btn.remove{color:var(--hanko);border-color:var(--hanko);background:transparent;}
  .cover-title{font-size:26px;font-weight:700;margin:4px 0 20px;display:flex;align-items:baseline;gap:10px;}
  .cover-title span.jp{font-size:30px;}
  .cover-balance-label{font-size:12px;color:#9fabc4;margin-bottom:2px;}
  .cover-balance{font-size:38px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:baseline;gap:6px;}
  .cover-balance .unit{font-size:17px;color:#c7cede;font-weight:500;}
  .cover-balance-idr{margin-top:4px;font-size:14px;color:#b6c9a4;}
  .kurs-chip{margin-top:16px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-size:12px;color:#eadfc4;cursor:pointer;}
  .kurs-chip input{width:56px;background:transparent;border:none;border-bottom:1px solid #eadfc4;color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;}

  .summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0;}
  .sum-card{background:#fbf7ea;border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:riseIn .4s ease both;}
  .sum-card .label{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .sum-card .val{font-size:18px;font-weight:600;}
  .sum-card.income .val{color:#7a6417;}
  .sum-card.expense .val{color:var(--hanko);}

  .section{padding:18px 16px 0;}
  .section-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .chart-card{background:#fbf7ea;border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px;}
  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:130px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-col .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center;}
  .chart-col .bar{width:9px;border-radius:3px 3px 0 0;min-height:2px;}
  .chart-col .bar.masuk{background:#d9822f;}
  .chart-col .bar.keluar{background:#ac3527;}
  .chart-col .lbl{font-size:11px;color:var(--mist);margin-top:6px;}
  .chart-legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:11px;color:var(--mist);}
  .chart-legend span{display:inline-flex;align-items:center;gap:5px;}
  .chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  .month-scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:14px -16px 0;}
  .month-scroller::-webkit-scrollbar{display:none;}
  .month-pill{flex:0 0 auto;font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--sumi);cursor:pointer;}
  .month-pill.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;}

  .ledger{margin-top:12px;background:#fbf7ea;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .ledger-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px dashed var(--line);animation:riseIn .3s ease both;}
  .ledger-row:last-child{border-bottom:none;}

  .hanko{--rot:0deg;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--hanko);
    display:flex;align-items:center;justify-content:center;color:var(--hanko);font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:17px;transform:rotate(var(--rot));position:relative;}
  .hanko::after{content:"";position:absolute;inset:3px;border:1px solid var(--hanko);border-radius:50%;opacity:.55;}
  .hanko.income{border-color:var(--kabocha);color:var(--kabocha);}
  .hanko.income::after{border-color:var(--kabocha);}
  .hanko.stamp-in{animation:stampIn .6s cubic-bezier(.2,1.5,.4,1) both;}

  .ledger-mid{flex:1;min-width:0;}
  .ledger-cat{font-size:13px;font-weight:600;}
  .ledger-note{font-size:12px;color:var(--mist);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ledger-date{font-size:11px;color:var(--mist);margin-top:1px;}

  .ledger-right{text-align:right;flex:0 0 auto;}
  .ledger-amount{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;}
  .ledger-amount.income{color:#7a6417;}
  .ledger-amount.expense{color:var(--hanko);}
  .trash-btn{margin-top:4px;background:none;border:none;padding:2px;color:var(--mist);cursor:pointer;opacity:.6;}
  .trash-btn:hover{opacity:1;color:var(--hanko);}

  .empty-state{padding:34px 20px;text-align:center;color:var(--mist);}
  .empty-state .stamp-outline{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;border:2px dashed var(--mist);
    display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:22px;}

  .fab{position:fixed;bottom:22px;right:18px;width:56px;height:56px;border-radius:50%;background:var(--hanko);
    color:#fff5e8;border:none;display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 20px -6px rgba(172,53,39,.55);cursor:pointer;z-index:30;font-size:26px;line-height:1;}
  .fab:active{transform:scale(0.95);}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(23,35,61,.45);z-index:40;display:none;align-items:flex-end;justify-content:center;}
  .sheet-backdrop.open{display:flex;}
  .sheet{width:100%;max-width:480px;background:var(--washi);border-radius:20px 20px 0 0;padding:18px 18px 26px;
    animation:sheetUp .28s cubic-bezier(.2,.9,.3,1) both;max-height:88vh;overflow-y:auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-title{font-family:'Shippori Mincho',serif;font-size:18px;font-weight:700;}
  .close-btn{background:none;border:none;color:var(--sumi);cursor:pointer;padding:4px;font-size:20px;}

  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .type-btn{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;
    font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sumi);}
  .type-btn.active.income{background:var(--kabocha);border-color:var(--kabocha);color:#fff;}
  .type-btn.active.expense{background:var(--hanko);border-color:var(--hanko);color:#fff;}

  .field-label{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;}
  .amount-input-wrap{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;}
  .amount-input-wrap span{font-family:'Shippori Mincho',serif;font-size:20px;color:var(--mist);}
  .amount-input-wrap input{border:none;outline:none;flex:1;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;background:transparent;width:100%;}
  .amount-idr-hint{font-size:12px;color:var(--mist);margin-top:4px;}

  .cat-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .cat-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;background:#fff;cursor:pointer;}
  .cat-chip .k{font-family:'Shippori Mincho',serif;}
  .cat-chip.active{background:var(--ai);border-color:var(--ai);color:#eee6d2;}

  .text-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;outline:none;}

  .submit-btn{margin-top:20px;width:100%;padding:13px;border-radius:12px;border:none;background:var(--ai);color:#eee6d2;
    font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}

  .icon{display:inline-flex;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------------------------------------------------------------
   帳簿 — Catatan Kerja Jepang (versi deploy, vanilla JS, no build step)
   Data disimpan di localStorage browser masing-masing device.
--------------------------------------------------------------------- */

const INCOME_CATS = [
  { id: "gaji", label: "Gaji", kanji: "給" },
  { id: "lembur", label: "Lembur", kanji: "残" },
  { id: "bonus", label: "Bonus", kanji: "賞" },
  { id: "lain_masuk", label: "Lainnya", kanji: "他" },
];
const EXPENSE_CATS = [
  { id: "makan", label: "Makan", kanji: "食" },
  { id: "asrama", label: "Sewa / Asrama", kanji: "住" },
  { id: "transport", label: "Transport", kanji: "交" },
  { id: "kirim", label: "Kirim ke RI", kanji: "送" },
  { id: "pajak", label: "Pajak / BPJS", kanji: "税" },
  { id: "hiburan", label: "Hiburan", kanji: "楽" },
  { id: "lain_keluar", label: "Lainnya", kanji: "他" },
];
const ALL_CATS = INCOME_CATS.concat(EXPENSE_CATS);
const catInfo = (id) => ALL_CATS.find(c => c.id === id) || ALL_CATS[ALL_CATS.length - 1];
const MONTHS_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

const yenFmt = new Intl.NumberFormat("ja-JP");
const idrFmt = new Intl.NumberFormat("id-ID");
const genFmt = new Intl.NumberFormat("en-US");
const uid = () => Math.random().toString(36).slice(2, 10);
const monthKey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const hashRotate = (id) => { let h=0; for (let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))%1000; return (h%14)-7; };
const esc = (s) => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

// ---- mata uang tujuan (kurs default per 1 ¥, bisa diedit manual di kartu kurs) ----
const CURRENCIES = [
  { code: "IDR", flag: "🇮🇩", name: "Rupiah Indonesia",   symbol: "Rp", rate: 111 },
  { code: "MMK", flag: "🇲🇲", name: "Kyat Myanmar",       symbol: "K",  rate: 13.3 },
  { code: "BDT", flag: "🇧🇩", name: "Taka Bangladesh",    symbol: "৳",  rate: 0.77 },
  { code: "VND", flag: "🇻🇳", name: "Dong Vietnam",       symbol: "₫",  rate: 164 },
  { code: "PHP", flag: "🇵🇭", name: "Peso Filipina",      symbol: "₱",  rate: 0.39 },
  { code: "THB", flag: "🇹🇭", name: "Baht Thailand",      symbol: "฿",  rate: 0.206 },
  { code: "KHR", flag: "🇰🇭", name: "Riel Kamboja",       symbol: "៛",  rate: 27 },
  { code: "NPR", flag: "🇳🇵", name: "Rupee Nepal",        symbol: "रु", rate: 0.96 },
  { code: "LKR", flag: "🇱🇰", name: "Rupee Sri Lanka",    symbol: "Rs", rate: 2.0 },
  { code: "INR", flag: "🇮🇳", name: "Rupee India",        symbol: "₹",  rate: 0.60 },
  { code: "CNY", flag: "🇨🇳", name: "Yuan Tiongkok",      symbol: "¥",  rate: 0.048 },
];
const getCurrency = () => CURRENCIES.find(c => c.code === currency) || CURRENCIES[0];
const getRate = () => (rates[currency] !== undefined ? rates[currency] : getCurrency().rate);
const fmtMoney = (n) => (currency === "IDR" ? idrFmt : genFmt).format(n);

// ---- state ----
let transactions = [];
let currency = "IDR";
let rates = {};
let selectedMonth = monthKey(new Date());
let showForm = false;
let showProfile = false;
let justAddedId = null;
let editingKurs = false;
let profile = { name: "", note: "", photo: "" };
let profileForm = { name: "", note: "", photo: "" };
let form = { type: "expense", catId: "makan", amount: "", date: new Date().toISOString().slice(0,10), note: "" };

// ---- persistence (localStorage) ----
function load() {
  try {
    const t = localStorage.getItem("jp-finance-transactions");
    if (t) transactions = JSON.parse(t);
  } catch (e) {}
  try {
    const r = localStorage.getItem("jp-finance-rates");
    if (r) rates = JSON.parse(r);
  } catch (e) {}
  try {
    const c = localStorage.getItem("jp-finance-currency");
    if (c) currency = c;
  } catch (e) {}
  try {
    const p = localStorage.getItem("jp-finance-profile");
    if (p) profile = Object.assign({ name: "", note: "", photo: "" }, JSON.parse(p));
  } catch (e) {}
  // migrasi dari versi lama yang cuma simpan kurs IDR tunggal
  try {
    const oldKurs = localStorage.getItem("jp-finance-kurs");
    if (oldKurs && rates.IDR === undefined) rates.IDR = Number(oldKurs);
  } catch (e) {}
}
function saveTx() { try { localStorage.setItem("jp-finance-transactions", JSON.stringify(transactions)); } catch(e){} }
function saveRates() { try { localStorage.setItem("jp-finance-rates", JSON.stringify(rates)); } catch(e){} }
function saveCurrency() { try { localStorage.setItem("jp-finance-currency", currency); } catch(e){} }
function saveProfile() {
  try { localStorage.setItem("jp-finance-profile", JSON.stringify(profile)); }
  catch (e) {
    // localStorage penuh (biasanya karena foto kegedean) — simpan tanpa foto sbg fallback
    try { localStorage.setItem("jp-finance-profile", JSON.stringify(Object.assign({}, profile, { photo: "" }))); } catch(e2){}
  }
}
function initials(name) {
  const parts = String(name||"").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "印";
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
// resize+compress foto profil ke max 240x240 biar hemat localStorage
function readAndResizeImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- derived ----
function totalYen() { return transactions.reduce((s,t)=> s + (t.type==="income"? t.amount : -t.amount), 0); }
function monthsPresent() {
  const set = new Set(transactions.map(t => monthKey(new Date(t.date))));
  set.add(monthKey(new Date()));
  return Array.from(set).sort().reverse();
}
function monthTx() { return transactions.filter(t => monthKey(new Date(t.date)) === selectedMonth); }
function chartData() {
  const now = new Date(); const out = [];
  for (let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = monthKey(d);
    const inc = transactions.filter(t=>t.type==="income" && monthKey(new Date(t.date))===key).reduce((s,t)=>s+t.amount,0);
    const exp = transactions.filter(t=>t.type==="expense" && monthKey(new Date(t.date))===key).reduce((s,t)=>s+t.amount,0);
    out.push({ name: MONTHS_ID[d.getMonth()], masuk: inc, keluar: exp });
  }
  return out;
}

// ---- render ----
function render() {
  const app = document.getElementById("app");
  const mTx = monthTx();
  const mIncome = mTx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const mExpense = mTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const sortedTx = [...mTx].sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  const cd = chartData();
  const maxVal = Math.max(1, ...cd.map(c => Math.max(c.masuk, c.keluar)));
  const months = monthsPresent();
  const cats = form.type === "income" ? INCOME_CATS : EXPENSE_CATS;

  app.innerHTML = `
    <div class="cover">
      <div class="cover-eyebrow">
        <span>通帳・kerja jepang</span>
        <button class="avatar-btn" id="avatarBtn" aria-label="Profil">${profile.photo ? `<img src="${profile.photo}" alt="Foto profil">` : esc(initials(profile.name))}</button>
      </div>
      <div class="cover-title"><span class="jp display">帳簿</span> Catatan Kerja Jepang</div>
      ${profile.name ? `<div class="cover-greeting">Halo, ${esc(profile.name)}${profile.note ? " · " + esc(profile.note) : ""}</div>` : ""}
      <div class="cover-balance-label">Saldo total</div>
      <div class="cover-balance mono"><span class="unit">¥</span>${yenFmt.format(totalYen())}</div>
      <div class="cover-balance-idr mono">≈ ${getCurrency().symbol} ${fmtMoney(Math.round(totalYen()*getRate()))}</div>
      ${editingKurs ? `
        <div class="kurs-chip" id="kursChip" style="flex-wrap:wrap;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 7h10M17 7v10M17 7L7 17" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <select id="currencySelect" class="mono" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;font-size:12px;padding:2px 4px;">
            ${CURRENCIES.map(c => `<option value="${c.code}" ${c.code===currency?"selected":""} style="color:#111;">${c.flag} ${c.code} — ${esc(c.name)}</option>`).join("")}
          </select>
          <span>1¥ = <input id="kursInput" class="mono" value="${esc(getRate())}" /> ${getCurrency().symbol}</span>
        </div>
      ` : `
        <div class="kurs-chip" id="kursChip">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 7h10M17 7v10M17 7L7 17" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mono">${getCurrency().flag} 1¥ = ${getCurrency().symbol}${getRate()}</span><span style="opacity:.6">&nbsp;· ganti mata uang / kurs</span>
        </div>
      `}
    </div>

    <div class="summary-row">
      <div class="sum-card income">
        <div class="label">↑ Pemasukan bulan ini</div>
        <div class="val mono">¥${yenFmt.format(mIncome)}</div>
      </div>
      <div class="sum-card expense">
        <div class="label">↓ Pengeluaran bulan ini</div>
        <div class="val mono">¥${yenFmt.format(mExpense)}</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Tren 6 Bulan</div>
      <div class="chart-card">
        <div class="chart-bars">
          ${cd.map(c => `
            <div class="chart-col">
              <div class="bars">
                <div class="bar masuk" style="height:${Math.max(2,(c.masuk/maxVal)*100)}%" title="Masuk ¥${yenFmt.format(c.masuk)}"></div>
                <div class="bar keluar" style="height:${Math.max(2,(c.keluar/maxVal)*100)}%" title="Keluar ¥${yenFmt.format(c.keluar)}"></div>
              </div>
              <div class="lbl">${c.name}</div>
            </div>
          `).join("")}
        </div>
        <div class="chart-legend">
          <span><i style="background:#d9822f"></i> Pemasukan</span>
          <span><i style="background:#ac3527"></i> Pengeluaran</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Buku Besar</div>
      <div class="month-scroller">
        ${months.map(m => {
          const [y,mo] = m.split("-");
          return `<div class="month-pill ${m===selectedMonth?"active":""}" data-month="${m}">${MONTHS_ID[parseInt(mo,10)-1]} ${y}</div>`;
        }).join("")}
      </div>
      <div class="ledger">
        ${sortedTx.length === 0 ? `
          <div class="empty-state">
            <div class="stamp-outline">印</div>
            Belum ada catatan bulan ini.<br>Stempel transaksi pertamamu.
          </div>
        ` : sortedTx.map(t => {
          const c = catInfo(t.catId);
          const rot = hashRotate(t.id);
          return `
            <div class="ledger-row">
              <div class="hanko ${t.type} ${justAddedId===t.id?"stamp-in":""}" style="--rot:${rot}deg">${c.kanji}</div>
              <div class="ledger-mid">
                <div class="ledger-cat">${esc(c.label)}</div>
                ${t.note ? `<div class="ledger-note">${esc(t.note)}</div>` : ""}
                <div class="ledger-date mono">${esc(t.date)}</div>
              </div>
              <div class="ledger-right">
                <div class="ledger-amount ${t.type}">${t.type==="income"?"+":"−"}¥${yenFmt.format(t.amount)}</div>
                <button class="trash-btn" data-del="${t.id}" aria-label="Hapus catatan">✕</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>

    <button class="fab" id="fabBtn" aria-label="Tambah transaksi">+</button>

    <div class="sheet-backdrop ${showForm?"open":""}" id="sheetBackdrop">
      <div class="sheet" id="sheetInner">
        <div class="sheet-head">
          <div class="sheet-title">Stempel Transaksi Baru</div>
          <button class="close-btn" id="closeSheet">✕</button>
        </div>
        <form id="txForm">
          <div class="type-toggle">
            <button type="button" class="type-btn income ${form.type==="income"?"active":""}" data-type="income">↑ Pemasukan</button>
            <button type="button" class="type-btn expense ${form.type==="expense"?"active":""}" data-type="expense">↓ Pengeluaran</button>
          </div>
          <div class="field-label">Jumlah (Yen)</div>
          <div class="amount-input-wrap">
            <span>¥</span>
            <input id="amountInput" inputmode="numeric" placeholder="0" value="${esc(form.amount)}" required>
          </div>
          <div class="amount-idr-hint mono" id="idrHint">${form.amount ? "≈ " + getCurrency().symbol + " " + fmtMoney(Math.round((parseInt(form.amount,10)||0)*getRate())) : ""}</div>

          <div class="field-label">Kategori</div>
          <div class="cat-grid" id="catGrid">
            ${cats.map(c => `<div class="cat-chip ${form.catId===c.id?"active":""}" data-cat="${c.id}"><span class="k">${c.kanji}</span> ${esc(c.label)}</div>`).join("")}
          </div>

          <div class="field-label">Tanggal</div>
          <input type="date" class="text-input" id="dateInput" value="${esc(form.date)}">

          <div class="field-label">Catatan (opsional)</div>
          <input type="text" class="text-input" id="noteInput" placeholder="cth. Kirim via Wise ke rekening BCA" value="${esc(form.note)}">

          <button type="submit" class="submit-btn">➤ Stempel &amp; Simpan</button>
        </form>
      </div>
    </div>

    <div class="sheet-backdrop ${showProfile?"open":""}" id="profileBackdrop">
      <div class="sheet" id="profileSheetInner">
        <div class="sheet-head">
          <div class="sheet-title">Profil</div>
          <button class="close-btn" id="closeProfileSheet">✕</button>
        </div>
        <form id="profileForm">
          <div class="profile-photo-row">
            <div class="profile-photo">${profileForm.photo ? `<img src="${profileForm.photo}" alt="Foto profil">` : esc(initials(profileForm.name))}</div>
            <div class="photo-actions">
              <label class="photo-btn" for="photoInput" style="text-align:center;">🖼️ ${profileForm.photo ? "Ganti Foto" : "Pasang Foto"}</label>
              <input type="file" id="photoInput" accept="image/*" style="display:none;">
              ${profileForm.photo ? `<button type="button" class="photo-btn remove" id="removePhotoBtn">Hapus Foto</button>` : ""}
            </div>
          </div>

          <div class="field-label">Nama</div>
          <input type="text" class="text-input" id="profileNameInput" placeholder="cth. Iranza" value="${esc(profileForm.name)}">

          <div class="field-label">Catatan (opsional)</div>
          <input type="text" class="text-input" id="profileNoteInput" placeholder="cth. Dispatch worker · Bifuka, Hokkaido" value="${esc(profileForm.note)}">

          <button type="submit" class="submit-btn">✓ Simpan Profil</button>
        </form>
      </div>
    </div>
  `;

  attachEvents();
}

function attachEvents() {
  const app = document.getElementById("app");

  const kursChip = document.getElementById("kursChip");
  if (kursChip) {
    if (editingKurs) {
      const inp = document.getElementById("kursInput");
      const sel = document.getElementById("currencySelect");
      inp.focus(); inp.select();
      const commit = () => {
        const v = parseFloat(String(inp.value).replace(",", "."));
        if (v > 0) rates[currency] = v;
        saveRates();
        editingKurs = false;
        render();
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
      inp.addEventListener("blur", commit);
      if (sel) {
        sel.addEventListener("click", e => e.stopPropagation());
        sel.addEventListener("change", () => {
          currency = sel.value;
          saveCurrency();
          render(); // tetap dalam mode edit, kurs default/tersimpan utk mata uang baru langsung tampil
        });
      }
      kursChip.addEventListener("click", e => e.stopPropagation());
    } else {
      kursChip.addEventListener("click", () => { editingKurs = true; render(); });
    }
  }

  app.querySelectorAll(".month-pill").forEach(el => {
    el.addEventListener("click", () => { selectedMonth = el.dataset.month; render(); });
  });

  app.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", () => {
      transactions = transactions.filter(t => t.id !== el.dataset.del);
      saveTx(); render();
    });
  });

  const avatarBtn = document.getElementById("avatarBtn");
  if (avatarBtn) avatarBtn.addEventListener("click", () => {
    profileForm = Object.assign({}, profile);
    showProfile = true;
    render();
  });

  const closeProfileSheet = document.getElementById("closeProfileSheet");
  const profileBackdrop = document.getElementById("profileBackdrop");
  if (closeProfileSheet) closeProfileSheet.addEventListener("click", () => { showProfile = false; render(); });
  if (profileBackdrop) profileBackdrop.addEventListener("click", (e) => { if (e.target === profileBackdrop) { showProfile = false; render(); } });
  const profileSheetInner = document.getElementById("profileSheetInner");
  if (profileSheetInner) profileSheetInner.addEventListener("click", e => e.stopPropagation());

  const photoInput = document.getElementById("photoInput");
  if (photoInput) {
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;
      try {
        profileForm.photo = await readAndResizeImage(file, 240);
        render();
      } catch (e) {
        alert("Gagal memuat foto, coba foto lain ya.");
      }
    });
  }
  const removePhotoBtn = document.getElementById("removePhotoBtn");
  if (removePhotoBtn) removePhotoBtn.addEventListener("click", () => { profileForm.photo = ""; render(); });

  const profileNameInput = document.getElementById("profileNameInput");
  if (profileNameInput) profileNameInput.addEventListener("input", () => { profileForm.name = profileNameInput.value; });
  const profileNoteInput = document.getElementById("profileNoteInput");
  if (profileNoteInput) profileNoteInput.addEventListener("input", () => { profileForm.note = profileNoteInput.value; });

  const profileFormEl = document.getElementById("profileForm");
  if (profileFormEl) {
    profileFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      profile = { name: (profileForm.name||"").trim(), note: (profileForm.note||"").trim(), photo: profileForm.photo || "" };
      saveProfile();
      showProfile = false;
      render();
    });
  }

  const fab = document.getElementById("fabBtn");
  if (fab) fab.addEventListener("click", () => { showForm = true; render(); });

  const closeSheet = document.getElementById("closeSheet");
  const backdrop = document.getElementById("sheetBackdrop");
  if (closeSheet) closeSheet.addEventListener("click", () => { showForm = false; render(); });
  if (backdrop) backdrop.addEventListener("click", (e) => { if (e.target === backdrop) { showForm = false; render(); } });
  const sheetInner = document.getElementById("sheetInner");
  if (sheetInner) sheetInner.addEventListener("click", e => e.stopPropagation());

  app.querySelectorAll("[data-type]").forEach(el => {
    el.addEventListener("click", () => {
      form.type = el.dataset.type;
      form.catId = (form.type === "income" ? INCOME_CATS : EXPENSE_CATS)[0].id;
      render();
      keepSheetOpen();
    });
  });

  app.querySelectorAll("[data-cat]").forEach(el => {
    el.addEventListener("click", () => { form.catId = el.dataset.cat; render(); keepSheetOpen(); });
  });

  const amountInput = document.getElementById("amountInput");
  if (amountInput) {
    amountInput.addEventListener("input", () => {
      form.amount = amountInput.value.replace(/[^0-9]/g, "");
      amountInput.value = form.amount;
      const hint = document.getElementById("idrHint");
      hint.textContent = form.amount ? "≈ " + getCurrency().symbol + " " + fmtMoney(Math.round((parseInt(form.amount,10)||0)*getRate())) : "";
    });
  }
  const dateInput = document.getElementById("dateInput");
  if (dateInput) dateInput.addEventListener("change", () => { form.date = dateInput.value; });
  const noteInput = document.getElementById("noteInput");
  if (noteInput) noteInput.addEventListener("input", () => { form.note = noteInput.value; });

  const txForm = document.getElementById("txForm");
  if (txForm) {
    txForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const amt = parseInt(String(form.amount).replace(/[^0-9]/g, ""), 10);
      if (!amt || amt <= 0) return;
      const tx = { id: uid(), type: form.type, catId: form.catId, amount: amt, date: form.date || new Date().toISOString().slice(0,10), note: (form.note||"").trim(), createdAt: Date.now() };
      transactions.unshift(tx);
      saveTx();
      selectedMonth = monthKey(new Date(tx.date));
      justAddedId = tx.id;
      showForm = false;
      form = { type: "expense", catId: "makan", amount: "", date: new Date().toISOString().slice(0,10), note: "" };
      render();
      setTimeout(() => { justAddedId = null; }, 900);
    });
  }
}

function keepSheetOpen() {
  // render() rebuilds DOM & resets scroll; re-open sheet flag already true, nothing extra needed.
}

load();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
